<style>
:root{--p:#1d5fd1;--pd:#143f94;--pl:#eaf1fd;--g:#16a34a;--r:#dc2626;--bg:#f3f5f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dde3ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
body.mo{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:760px;margin:0 auto;min-height:100vh;position:relative}
.top{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:12px;height:66px;padding:0 16px}
.ttl-sub{display:block;font-size:.7rem;font-weight:400;color:#fff;line-height:1.1;margin-top:1px;letter-spacing:.02em}
.ttl{flex:1;line-height:1.15;font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-s{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.ibtn{width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center}
.setbar .ibtn,.mh .ibtn{background:var(--pl);color:var(--pd)}
.ibtn.bk,.rf-top>.ibtn.bk{width:auto!important;min-width:44px;padding:0 12px;gap:6px;font-size:.85rem;font-weight:700;white-space:nowrap;flex:none}
.ibtn.bk span{font-size:.8rem;font-weight:700;line-height:1}
.savepill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;letter-spacing:.02em;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:5px 12px 5px 8px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.12);opacity:0;visibility:hidden;transform:scale(.85);pointer-events:none;transition:opacity .3s,visibility .3s,background .3s,transform .3s,box-shadow .3s}
.savepill svg{width:14px;height:14px;padding:2px;border-radius:50%;background:#22c55e;color:#fff;box-sizing:content-box;box-shadow:0 0 0 0 rgba(34,197,94,.7),0 0 8px 2px rgba(74,222,128,.85);animation:saveGlow 1.8s ease-in-out infinite}
@keyframes saveGlow{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.65),0 0 6px 1px rgba(74,222,128,.7)}50%{box-shadow:0 0 0 5px rgba(34,197,94,0),0 0 14px 4px rgba(74,222,128,1)}}
@media (prefers-reduced-motion:reduce){.savepill svg{animation:none}}
@keyframes savePop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}
.savepill.flash i{display:inline-block;animation:savePop .45s cubic-bezier(.2,.9,.3,1.3)}
@media (prefers-reduced-motion:reduce){.savepill.flash i{animation:none}}
.savepill.flash{opacity:1;visibility:visible;background:rgba(34,197,94,.9);border-color:rgba(255,255,255,.55);transform:scale(1);box-shadow:0 4px 16px rgba(34,197,94,.45)}
.savepill.flash svg{background:#fff;color:#16a34a;animation:none;box-shadow:0 0 12px 4px rgba(255,255,255,.9)}
main{padding:14px 14px 90px}
main.pad-fab{padding:14px 8px 160px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;width:100%;max-width:760px}
.nav button{flex:1;border:0;background:none;padding:8px 2px 6px;font-size:.72rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
.nav button i{font-size:1.2rem}
.nav button.on{color:var(--p);font-weight:700}
.h2{font-size:1.15rem;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card.cur{border-color:var(--p);background:var(--pl)}
.card small{display:block;color:var(--mut)}
.hero{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border-radius:20px;padding:22px 18px;text-align:center;margin-bottom:14px}
.hero-ic{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin:0 auto 8px}
.hero h1{margin:0;font-size:1.8rem;letter-spacing:1px}
.hero p{margin:4px 0 0;opacity:.9}
.hero-sc{margin-top:10px;font-weight:600;background:rgba(255,255,255,.15);display:inline-block;padding:4px 14px;border-radius:99px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--bd);border-radius:18px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:1rem;padding:10px;text-align:center}
.tile i{font-size:1.9rem;color:var(--p)}
.tile:active{background:var(--pl)}
.tile.main{grid-column:1/-1;background:var(--p);color:#fff;border-color:var(--p);flex-direction:row;min-height:84px;font-size:1.2rem}
.tile.main i{color:#fff}
.btn{border:0;border-radius:14px;min-height:50px;padding:10px 16px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--p);color:#fff}
.btn.ghost{background:var(--pl);color:var(--pd)}
.btn.dng{background:var(--r);color:#fff}
.btn.ok{background:var(--g);color:#fff}
.btn.big{width:100%;margin-top:12px}
.btn.sm{min-height:42px;padding:6px 12px;font-size:.92rem}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2>.btn{flex:1}
.in{width:100%;min-height:50px;border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;background:#fff;font-size:1rem}
.in:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(29,95,209,.15)}
.in.bad{border-color:var(--r);background:#fff5f5}
.lb{display:block;font-weight:600;margin:12px 0 5px;font-size:.95rem}
.lb small{color:var(--mut);font-weight:400}
.fe{color:var(--r);font-size:.82rem;min-height:0}
.err{color:var(--r);background:#fff1f1;border-radius:10px;padding:0;font-weight:600;font-size:.92rem}
.err:not(:empty){padding:10px 12px;margin-top:10px}
.cls-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clsb{background:#fff;border:2px solid var(--bd);border-radius:18px;min-height:92px;font-weight:700;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.clsb span{font-size:2rem;color:var(--p)}
.clsb.on{border-color:var(--p);background:var(--pl)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.dots i{width:30px;height:6px;border-radius:4px;background:var(--bd)}
.dots i.on{background:var(--p)}
.sublist{display:grid;gap:8px}
.subi{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--bd);border-radius:14px;min-height:54px;padding:8px 14px;font-size:1rem;text-align:left}
.subi .cb{width:26px;height:26px;border:2px solid var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;color:transparent;font-size:.9rem;flex:none}
.subi.on{border-color:var(--p);background:var(--pl)}
.subi.on .cb{background:var(--p);border-color:var(--p);color:#fff}
.addsub{display:flex;gap:8px;margin-top:12px}
.subrow{display:flex;gap:8px;align-items:stretch}
.subrow .subi{flex:1;min-width:0}
.subdel{flex:none;width:54px;min-height:54px;border:0;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:linear-gradient(180deg,#eb9ba3,#d97983);box-shadow:0 4px 0 #b25d66,0 6px 10px rgba(20,40,80,.16),inset 0 1px 0 rgba(255,255,255,.38);transition:transform .08s ease,box-shadow .08s ease}
.subdel svg{width:20px;height:20px}
.subdel:active{transform:translateY(3px);box-shadow:0 1px 0 #b25d66,0 2px 4px rgba(20,40,80,.16)}
.addsub .in{flex:1}
.sys{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sysb{background:#fff;border:2px solid var(--bd);border-radius:18px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sysb b{font-size:2.2rem;color:var(--p)}
.sysb.on{border-color:var(--p);background:var(--pl)}
.setbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.setbar>div{flex:1;min-width:0}
.setbar small{color:var(--mut);display:block}
.search{position:relative;margin-bottom:10px}
.search i{position:absolute;left:14px;top:17px;color:var(--mut)}
.sugbox{position:absolute;left:0;right:0;top:calc(100% - 6px);z-index:20;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sugbox:empty{display:none}
.sugi{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd);min-height:48px}
.sugi:last-child{border-bottom:0}
.sugi:active{background:var(--pl)}
.sugi b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sugi mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
.sugi small{color:var(--mut);flex:none}
.sugn{padding:12px 14px;color:var(--mut)}
/* ===== Kadi za Chapisha ===== */
.pkw{display:grid;gap:14px;margin-top:14px}
.pk{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:22px;padding:18px 16px;min-height:104px;color:#fff;box-shadow:0 12px 24px -10px var(--sh,rgba(15,23,42,.4));transition:transform .15s,box-shadow .15s}
.pk:active{transform:scale(.98)}
.pk::before,.pk::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.pk::before{right:-34px;top:-40px;width:140px;height:140px}
.pk::after{right:40px;bottom:-56px;width:96px;height:96px;background:rgba(255,255,255,.08)}
.pk-ic,.pk-tx,.pk-go{position:relative;z-index:1}
.pk-ic{flex:none;width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.pk-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pk-tx b{font-size:1.02rem;line-height:1.2;letter-spacing:.2px}
.pk-tx small{font-size:.8rem;line-height:1.35;font-weight:500;opacity:.92}
.pk-go{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;background:rgba(255,255,255,.22)}
.pk1{background:linear-gradient(135deg,#2563eb,#4f46e5 58%,#7c3aed);--sh:rgba(79,70,229,.65)}
.pk2{background:linear-gradient(135deg,#9333ea,#db2777 68%,#f43f5e);--sh:rgba(219,39,119,.6)}
.pk-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk.pk-s{flex-direction:column;align-items:flex-start;gap:10px;min-height:156px;padding:16px 14px 14px;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-bottom:4px solid var(--a);box-shadow:0 8px 18px -12px rgba(15,23,42,.45)}
.pk-s::before{background:var(--a);opacity:.1;right:-30px;top:-36px;width:110px;height:110px}
.pk-s::after{display:none}
.pk-s .pk-ic{width:50px;height:50px;font-size:1.3rem;color:#fff;background:var(--a);box-shadow:0 8px 16px -6px var(--a)}
.pk-s .pk-tx b{font-size:.92rem}
.pk-s .pk-tx small{font-size:.76rem;opacity:.72}
.pk-s .pk-go{position:absolute;right:12px;top:12px;width:28px;height:28px;color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}
.pk3{--a:#dc2626}.pk4{--a:#16a34a}
@media(min-width:760px){.pkw{grid-template-columns:1fr 1fr}.pk-row{grid-column:1/-1}}
.rk{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.rk:active{background:var(--pl)}
.rkt{display:flex;align-items:center;gap:10px}
.rkt b{flex:1;min-width:0}
.rk small{display:block;color:var(--mut);margin-top:2px}
.rkc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rkc i{font-style:normal;font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:99px;background:#fee2e2;color:#b91c1c}
.search input{padding-left:40px}
.ways{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.ways .way{flex:0 0 auto;flex-direction:row!important;align-items:center!important;gap:8px!important;padding:8px 12px!important;border-radius:14px!important;max-width:215px}
.ways .way .wi{width:30px!important;height:30px!important;font-size:.9rem!important;flex:none}
.ways .way small{display:none!important}
.ways .way b{font-size:.82rem!important}
.ways.big .way small{display:block!important}
.ways .way{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:12px;min-height:0;color:var(--tx)}
.ways .way .wi{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--al);color:var(--a);font-size:1rem}
.ways .way b{font-size:.92rem;line-height:1.2;display:block}
.ways .way small{color:var(--mut);font-size:.78rem;line-height:1.25;display:block}
.ways.big{display:grid;grid-template-columns:1fr;gap:10px;overflow:visible;margin-bottom:12px}
.ways.big .way{flex-direction:row!important;align-items:center!important;gap:12px!important;padding:14px!important;max-width:none;border-radius:16px!important}
.ways.big .way .wi{width:46px!important;height:46px!important;font-size:1.2rem!important;flex:none}
.ways.big .way b{font-size:1rem!important}
.ways.big .way small{font-size:.85rem}
.nxt{padding:4px 2px 12px}
.nxt b{display:block;font-size:1.05rem}
.nxt small{color:var(--mut)}
.lnk{background:none;border:0;color:var(--p);font-weight:700;padding:10px 4px;text-decoration:underline}
.mc[data-act],.c2[data-act]{cursor:pointer}
.toolrow{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{border:1.5px solid var(--bd);background:#fff;border-radius:99px;padding:8px 14px;white-space:nowrap;font-size:.9rem;font-weight:600;min-height:42px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.toolrow .chip{border-color:var(--a);background:var(--al);color:var(--a)}
.toolrow .chip:nth-child(1){--a:#1d5fd1;--al:#eaf1fd}
.toolrow .chip:nth-child(2){--a:#16a34a;--al:#e8f7ee}
.toolrow .chip:nth-child(3){--a:#d97706;--al:#fff4e0}
.toolrow .chip:nth-child(4){--a:#9333ea;--al:#f3e8ff}
.toolrow .chip:nth-child(5){--a:#dc2626;--al:#fdecec}
.toolrow .chip:nth-child(6){--a:#0891b2;--al:#e0f6fa}
.toolrow .chip:nth-child(7){--a:#db2777;--al:#fde7f1}
.toolrow .chip:nth-child(8){--a:#ea580c;--al:#fff1e6}
.toolrow .chip.on{background:var(--a);color:#fff;border-color:var(--a)}
html[data-theme=dark] .toolrow .chip{background:color-mix(in srgb,var(--a) 20%,#0f172a)}
html[data-theme=dark] .toolrow .chip.on{background:var(--a)}
.tablewrap{overflow:auto;border:1px solid var(--bd);border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch}
table.rt{border-collapse:collapse;width:max-content;min-width:100%;font-size:.8rem;transform-origin:0 0}
.rt th,.rt td{padding:7px 3px;border:1px solid #aab6c9;white-space:nowrap;text-align:center;background:#fff}
html[data-theme=dark] .rt th,html[data-theme=dark] .rt td{border-color:#475569}
.rt th{background:var(--pl);color:var(--pd);font-size:.74rem}
.rt .c1{width:24px}
.rt .c2{text-align:left;padding-left:5px}
.rt th.sj{padding:6px 2px;vertical-align:bottom}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;margin:0 auto;max-height:130px;overflow:hidden;text-overflow:ellipsis}
.nm{font-weight:700;white-space:normal;word-break:break-word;min-width:70px;max-width:105px;cursor:pointer;line-height:1.25}
.nm i{color:var(--p);font-size:.7rem;margin-left:4px}
.acts{display:flex;gap:6px;margin-top:6px}
.sbtn{width:38px;height:34px;border:0;border-radius:9px;background:var(--pl);color:var(--pd)}
.sbtn.d{background:#fdecec;color:var(--r)}
.sbtn.g{background:#e6f6ec;color:var(--g)}
.gb{display:inline-block;min-width:26px;padding:2px 8px;border-radius:8px;font-weight:700;color:#fff;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.g-A{background:#16a34a}.g-B{background:#1d5fd1}.g-C{background:#64748b}.g-D{background:#d97706}.g-E{background:#dc2626}
.empty{text-align:center;color:var(--mut);padding:26px 14px}
.empty i{font-size:2.2rem;color:var(--bd);display:block;margin-bottom:8px}
.fabbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:25;pointer-events:none}
.fabin{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;gap:10px;background:linear-gradient(to top,var(--bg) 70%,rgba(243,245,249,0))}
.fabin .btn{pointer-events:auto;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.fabin .btn.pri{flex:1}
.fabin.selbar .btn{padding-left:8px;padding-right:8px;font-size:.88rem}
.fabin.selbar .btn:disabled{opacity:.45}
.fabin.selbar .btn.ghost[data-act=selcancel]{flex:none;width:48px}
.eyeb{flex:none;width:48px;height:auto;min-height:44px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card)}
.eyeb.on{background:#fff4e0;border-color:#d97706;color:#b45309}
.ng{border:1.5px solid var(--a,#1d5fd1);border-radius:14px;margin-top:10px;background:#eaf1fd;overflow:hidden}
.ng:nth-of-type(7n+2){--a:#16a34a;background:#e8f7ee}.ng:nth-of-type(7n+3){--a:#d97706;background:#fff4e0}.ng:nth-of-type(7n+4){--a:#9333ea;background:#f3e8ff}
.ng:nth-of-type(7n+5){--a:#dc2626;background:#fdecec}.ng:nth-of-type(7n+6){--a:#0891b2;background:#e0f6fa}.ng:nth-of-type(7n+7){--a:#db2777;background:#fde7f1}
.ng>.ngs{display:flex;align-items:center;gap:10px;padding:12px;min-height:50px;font-weight:800;cursor:pointer}
.ng>.ngs>i{color:var(--a,#1d5fd1)}
.mf.selbar2{gap:6px}.mf.selbar2 .btn{padding-left:6px;padding-right:6px;font-size:.84rem}.mf.selbar2 .btn:disabled{opacity:.45}
.ng>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px;min-height:50px;font-weight:800;cursor:pointer}
.ng>summary::-webkit-details-marker{display:none}
.ngt{flex:1;color:var(--a,#1d5fd1)}.ngc{font-size:.8rem;font-weight:700;color:var(--mut)}
.ng>summary>i{color:var(--a,#1d5fd1);transition:transform .2s}.ng[open]>summary>i{transform:rotate(180deg)}
.nl{background:var(--card);padding:2px 12px 6px}
.nr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.nr:first-child{border-top:0}
.nn{flex:none;width:26px;color:var(--mut);font-size:.85rem;font-weight:700}
.nm2{flex:1;font-weight:700;cursor:pointer;min-height:24px}
.ngd{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:#fff}
.ngd.m{background:#1d5fd1}.ngd.f{background:#db2777}
html[data-theme=dark] .ng{background:color-mix(in srgb,var(--a,#1d5fd1) 16%,#0f172a)}
.sy{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 2px;padding-bottom:4px;border-bottom:2px solid var(--bd)}
.sy b{font-size:1.15rem;color:var(--k2,#143f94)}.sy small{color:var(--mut);font-weight:700}
.selb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:2px solid #94a3b8;border-radius:6px;background:#fff;color:#fff;font-size:.7rem}
.selb.on{background:#16a34a;border-color:#16a34a}
tr.selr td{background:#e8f7ee!important}
.nr.selr{background:#e8f7ee;border-radius:8px}
html[data-theme=dark] .nr.selr{background:#0f2a1c}
.nr .nn .selb{margin:0 auto}
html[data-theme=dark] tr.selr td{background:#0f2a1c!important}
.toolrow .chip:nth-child(9){--a:#0e9f6e;--al:#e3f7ef}
.hint{color:var(--mut);font-size:.9rem;margin:4px 0 10px}
.sigwarn{color:#92400e;background:#fffbeb;border:1.5px solid #f59e0b;border-radius:12px;padding:9px 12px;font-size:.88rem;font-weight:600;margin:8px 0 10px;font-style:normal!important}
html[data-theme=dark] .sigwarn{background:#3a2a0a;color:#fcd34d;border-color:#b45309}
table.qt{border-collapse:separate;border-spacing:0;font-size:.9rem}
.qt th,.qt td{padding:6px;border-bottom:1px solid var(--bd);background:#fff;text-align:center}
.qt th{background:var(--pl);color:var(--pd);font-size:.8rem}
.qi{width:68px;min-height:44px;border:1.5px solid var(--bd);border-radius:10px;padding:6px;font-size:1rem;background:#fff;text-align:center}
.qi.qn{width:130px;text-align:left}
.qi.qg{width:64px}
tr.bad .qi{border-color:var(--r);background:#fff5f5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--pd)}
.stat span{font-size:.85rem;color:var(--mut)}
.stat.wide{grid-column:1/-1;background:var(--p);border-color:var(--p)}
.stat.wide b,.stat.wide span{color:#fff}
.stat.wide b{font-size:2.2rem}
.gstats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.gstats div{background:#fff;border:1px solid var(--bd);border-radius:12px;text-align:center;padding:8px 2px}
.gstats b{display:block;font-size:1.3rem}
.bars .brow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.9rem}
.bars .brow span{width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .bar{flex:1;height:18px;background:#e9edf4;border-radius:9px;overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--p);border-radius:9px;min-width:2px}
.bars .brow em{width:56px;text-align:right;font-style:normal;font-weight:700}
.stl{display:flex;align-items:center;gap:10px}
.stl .pos{width:42px;height:42px;border-radius:50%;background:var(--pl);color:var(--pd);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.stl .nfo{flex:1;min-width:0}
.stl .nfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stl .nfo small{color:var(--mut)}
.rlist{display:grid;grid-template-columns:1fr;gap:6px;margin-top:4px}
.rlist .card.stl{margin:0;padding:6px 8px 6px 6px;gap:8px;border-left-width:4px;border-radius:12px;min-width:0}
.rlist .stl .pos{width:32px;height:32px;font-size:.85rem}
.rlist .stl .nfo b{font-size:.92rem;line-height:1.25}
.rlist .stl .nfo small{display:block;font-size:.74rem;line-height:1.3}
.rlist .stl .gb{min-width:26px;padding:2px 7px;font-size:.85rem}
.rlist .stl .btn.sm{min-height:34px;height:34px;padding:0 10px}
.rlist .stl .btn.rvb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:auto;min-height:42px;padding:3px 10px;line-height:1}
.rlist .stl .btn.rvb .rvl{font-size:.68rem;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
@media(min-width:640px){.rlist{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sg{font-size:.68rem;color:var(--mut);white-space:nowrap;line-height:1.25}
.gx{font-size:.86rem;font-weight:800;letter-spacing:.02em}
.gt-A{color:#16a34a}.gt-B{color:#1d5fd1}.gt-C{color:#64748b}.gt-D{color:#d97706}.gt-E{color:#dc2626}
.svrow{margin-top:10px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--bd);cursor:pointer}
.svrow.on{border-color:var(--p);background:var(--pl)}
.svrow>i{color:var(--mut)}
.big-actions{display:grid;gap:12px}
.cm{width:100%;min-height:80px;border:1.5px solid var(--bd);border-radius:12px;padding:10px;font-size:1rem;resize:vertical}
.logo-prev{width:90px;height:90px;border:1.5px dashed var(--bd);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;font-size:2rem;color:var(--bd)}
.logo-prev img{max-width:100%;max-height:100%}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border-radius:22px 22px 0 0;animation:up .25s ease}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.mh h3{margin:0;font-size:1.15rem}
.mb{overflow:auto;padding:4px 16px 12px}
.mf{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
.mf .btn{flex:1}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.entoff{display:none!important}
.entbox{background:var(--pl);border:1.5px solid var(--bd);border-radius:14px;padding:10px 12px;margin:10px 0}
.entrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.entrow b{font-size:.95rem}.entrow small{display:block;opacity:.75;font-weight:500}
.entsw{position:relative;flex:0 0 auto;width:54px;height:30px;border-radius:99px;border:0;background:#cbd5e1;transition:background .15s;padding:0}
.entsw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.entsw.on{background:#16a34a}.entsw.on i{left:27px}
.entchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:flex;gap:10px}
.segb{flex:1;min-height:50px;border:2px solid var(--bd);background:#fff;border-radius:12px;font-weight:700}
.segb.on{border-color:var(--p);background:var(--pl);color:var(--pd)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:22px}}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px) scale(.96);background:rgba(17,24,39,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;padding:12px 20px;border-radius:99px;border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:90;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.9,.3,1.2);max-width:90vw;text-align:center;font-weight:600;font-size:.92rem}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.bad{background:rgba(220,38,38,.92)}
#printRoot{display:none}
/* ===== REPORT ===== */
.rp,.rp *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp{background:#fff;color:#1b2430;border:1px solid #e0e7ff;border-radius:18px;padding:0;overflow:hidden;font-size:13px;line-height:1.4;box-shadow:0 6px 18px rgba(67,56,202,.12)}
.rp-head{display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(135deg,var(--k1) 0%,var(--k2) 55%,var(--k3) 100%);color:#fff}
.rp-logo{width:60px;height:60px;object-fit:contain;flex:none;background:#fff;border-radius:50%;padding:4px;border:3px solid rgba(255,255,255,.55)}
.rp-logo.ph{display:flex;align-items:center;justify-content:center;font-size:28px}
.rp-sc{flex:1;min-width:0;text-align:left}
.rp-sc h2{margin:0;font-size:17px;text-transform:uppercase;letter-spacing:.5px;color:#fff;line-height:1.2}
.rp-sc p{margin:3px 0 0;color:rgba(255,255,255,.88);font-size:11.5px}
.rp-title{text-align:center;font-weight:800;letter-spacing:2px;background:#fbbf24;color:#1e1b4b;padding:6px;font-size:12px}
.rp-body{padding:14px 16px 12px}
.rp-stu{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#eef2ff,#fdf2f8);border:1px solid #e0e7ff;border-radius:14px;padding:12px;margin-bottom:12px}
.rp-av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#f97316,#db2777);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}
.rp-who{flex:1;min-width:0}
.rp-nm{font-size:17px;font-weight:800;color:#1e1b4b;line-height:1.2;word-break:break-word}
.rp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rp-chips span{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.rp-chips span:nth-child(1){background:#dbeafe;color:#1d4ed8}
.rp-chips span:nth-child(2){background:#dcfce7;color:#15803d}
.rp-chips span:nth-child(3){background:#fef3c7;color:#b45309}
.rp-chips span:nth-child(4){background:#f3e8ff;color:#7e22ce}
.rp-chips span:nth-child(5){background:#fce7f3;color:#be185d}
.rp-st{flex:none;align-self:flex-start;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:99px;color:#fff;letter-spacing:.3px}
.rp-st.ok{background:#16a34a}.rp-st.no{background:#dc2626}

.rp-sum div:nth-child(2){background:linear-gradient(135deg,#10b981,#047857)}

.rp-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--k2);margin:14px 0 7px;font-size:12px;letter-spacing:1px}

.pb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;break-inside:avoid}
.pb span{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rp-cm{background:#fffbeb;border:1px solid #fde68a;border-left:5px solid #f59e0b;border-radius:10px;padding:9px 12px;min-height:40px;break-inside:avoid;white-space:pre-wrap;font-style:italic}

.rp-key{font-size:10.5px;color:#555;margin-top:12px}
.rp-foot{font-size:10px;color:#fff;text-align:center;padding:7px;background:linear-gradient(90deg,var(--k1),var(--k3))}
.pt{width:100%;border-collapse:collapse;font-size:11px}
.pt th,.pt td{border:1px solid #999;padding:4px 5px;text-align:center}
.pt td.l{text-align:left}
.pt th{background:#eaf1fd;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rt-tbl .pt th{background:linear-gradient(135deg,var(--k1),var(--k2));color:#fff;border-color:var(--k2);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rt-tbl .pt tbody tr:nth-child(even) td{background:#f4f6fb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rt-tbl .pt{border-color:var(--k2)}
@page{size:A4;margin:12mm}
.pr-time{text-align:right;font-size:9px;color:#64748b;margin-top:6px;font-weight:600}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  html,body{background:#fff!important}
  .report-page{break-after:page;page-break-after:always;border:0!important;border-radius:0!important;padding:0!important}
  .report-page:last-child{break-after:auto;page-break-after:auto}
  .report-page.rp{break-inside:avoid;page-break-inside:avoid;max-height:272mm;overflow:hidden}
  html,body{overflow:visible!important;height:auto!important;position:static!important}
  body.mo{overflow:visible!important}
}

/* ===== Kila kadi rangi tofauti ===== */
.grid .tile:not(.main):nth-child(2){--a:#16a34a;--al:#e8f7ee}
.grid .tile:not(.main):nth-child(3){--a:#d97706;--al:#fff4e0}
.grid .tile:not(.main):nth-child(4){--a:#9333ea;--al:#f3e8ff}
.grid .tile:not(.main):nth-child(5){--a:#dc2626;--al:#fdecec}
.grid .tile:not(.main):nth-child(6){--a:#0891b2;--al:#e0f6fa}
.grid .tile:not(.main){border:2px solid var(--a);background:var(--al)}
.grid .tile:not(.main) i{color:var(--a)}
.grid .tile:not(.main):active{background:#fff}

/* ===== Chaguo la lugha na bendera ===== */
.lgs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:8px}
.lgb{position:relative;display:flex;align-items:center;gap:10px;min-height:0;padding:10px;border-radius:16px;border:2px solid var(--bd);background:var(--card);font-weight:800;font-size:.92rem;text-align:left}
.lgb .flg{flex:none;width:42px;height:28px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 5px rgba(0,0,0,.18);display:block}
.lgb .flg svg{display:block;width:100%;height:100%}
.lgb .lgn{flex:1;min-width:0}
.lgb .ck{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--a);color:#fff;border:2px solid var(--card);font-size:.6rem;display:none;align-items:center;justify-content:center}
.lgb.on{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent)}
.lgb.on .ck{display:flex}
.lgb.on .lgn{color:var(--a)}

/* --- Ingiza + Chapisha upande kwa upande --- */
.grid .tile.half{grid-column:auto;flex-direction:column;justify-content:center;align-items:center;gap:5px;min-height:104px;padding:8px 8px;text-align:center;font-size:.95rem}

.grid .tile.main.half{grid-column:auto}
.grid .tile.pr .pico{width:38px;height:38px}
.grid .tile.half .nbp{transform:scale(.9)}
.grid .tile.half>i{font-size:1.6rem}
.grid .tile.pr .tx{align-items:center}
.grid .tile.pr .tx b{font-size:1rem}
.grid .tile.pr .tx small{font-size:.68rem;line-height:1.25}

/* ===== Jukwaa la Wanafunzi Bora 3 ===== */
.pod{grid-column:1/-1;min-width:0;max-width:100%;border-radius:20px;padding:14px 14px 0;overflow:hidden;background:linear-gradient(165deg,#fff4d6,#fff 70%);border:1.5px solid #f5d98b;box-shadow:0 4px 14px rgba(245,158,11,.16)}

.pod .podh i{color:#f59e0b}
.pod .pods{margin:2px 0 0;font-size:.76rem;color:var(--mut)}

.pdc .pav{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.1rem;background:var(--m);border:3px solid color-mix(in srgb,var(--m) 55%,#fff);box-shadow:0 2px 8px rgba(0,0,0,.18)}

.pdc .pnm{font-size:.76rem;font-weight:700;line-height:1.2;margin:6px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;word-break:break-word;min-height:1.8em}

.pdc .stp{width:100%;margin-top:6px;border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:6px;color:#fff;font-weight:800;font-size:1.35rem;background:linear-gradient(180deg,var(--m),color-mix(in srgb,var(--m) 68%,#000))}
.pdc.g1 .stp{height:88px}.pdc.g2 .stp{height:66px}.pdc.g3 .stp{height:52px}

/* --- Jukwaa: toleo fupi --- */
.pod{padding:10px 12px 0;position:relative}

/* ===== Muonekano na Uingizaji: kisasa ===== */
.thms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.thm{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 6px 10px;min-height:0;border-radius:16px;border:2px solid var(--bd);background:var(--card);font-weight:700;font-size:.85rem}

.thm .pv{width:100%;height:58px;border-radius:10px;border:1px solid #cbd5e1;position:relative;overflow:hidden}

.thm .pv::after{content:'';position:absolute;left:8px;top:26px;width:35%;height:7px;border-radius:4px;background:var(--a)}
.thm .pv.l{background:#fff}
.thm .pv.d{background:#0f172a;border-color:#334155}
.thm .pv.a{background:linear-gradient(135deg,#fff 50%,#0f172a 50%)}
.thm .ck{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--a);color:#fff;font-size:.62rem;display:none;align-items:center;justify-content:center}
.thm.on .ck{display:flex}
.trow{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--bd);border-radius:16px;margin-top:10px;background:var(--card)}
.trow .ti{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.05rem;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000))}
.trow .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trow .tt b{font-size:.95rem;line-height:1.25}
.trow .tt small{font-size:.76rem;color:var(--mut);line-height:1.3}
.sw{flex:none;position:relative;width:52px;height:30px;min-height:0;padding:0;border:0;border-radius:99px;background:#cbd5e1;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:#16a34a}

@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}

.cg:active{transform:scale(.97)}

.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

.sxt{--a:#2563eb;--al:#e8f0fe;--a2:#1d4ed8;position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;min-height:150px;border-radius:22px;border:1px solid rgba(15,23,80,.07);background:linear-gradient(155deg,var(--al),#fff 72%);text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 8px 22px rgba(15,23,80,.08);transition:transform .15s,box-shadow .15s;animation:sxIn .4s both;-webkit-tap-highlight-color:transparent}
.sxt:nth-child(2){animation-delay:.05s}.sxt:nth-child(3){animation-delay:.1s}.sxt:nth-child(4){animation-delay:.15s}.sxt:nth-child(5){animation-delay:.2s}
.sxt:active{transform:scale(.97);box-shadow:0 3px 10px rgba(15,23,80,.1)}
.sxt .sxi,.sxh .sxi{flex:none;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.05rem;box-shadow:0 6px 14px rgba(15,23,80,.22)}
.sxt .sxn{display:block}.sxt .sxn b{display:block;font-size:.98rem;line-height:1.2;color:var(--a)}.sxt .sxn small{display:block;font-size:.74rem;opacity:.75;margin-top:2px}
.sxt .sxp{margin-top:auto;display:flex;flex-direction:column;gap:3px;min-width:0}
.sxt .sxp small{font-size:.76rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sxt .sxv{font-size:1.3rem;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#14233f}
.sxt .sxv.ok{color:#16a34a}
.sxt .sxs{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#e5e9f2;gap:2px}.sxt .sxs i{display:block;min-width:4px}
.sxt .sxc{position:absolute;right:12px;top:14px;opacity:.35;font-size:.8rem}
.sxt.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.sxt.wide .sxn{flex:1}.sxt.wide .sxp{margin:0;align-items:flex-end;text-align:right}.sxt.wide .sxc{position:static;opacity:.4}
.sxt.a-g{--a:#9333ea;--al:#f3e8ff;--a2:#6d28d9}.sxt.a-s{--a:#0891b2;--al:#e0f6fa;--a2:#0e7490}.sxt.a-b{--a:#16a34a;--al:#e8f7ee;--a2:#15803d}.sxt.a-w{--a:#dc2626;--al:#fdecec;--a2:#b91c1c}.sxt.a-t{--a:#d97706;--al:#fff4e0;--a2:#b45309}
@keyframes sxIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sxt{animation:none}}

/* Vitufe < > vya juu: 3D tulivu, rangi tofauti */
.rf-seg{background:transparent!important;box-shadow:none!important;padding:0!important;gap:10px}
.rf-seg i{display:none}
.rf-seg button{width:54px!important;height:48px!important;border-radius:14px!important;color:#fff!important;transition:transform .08s ease,box-shadow .08s ease}
.rf-seg svg{width:26px!important;height:26px!important;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.rf-seg button:not(:disabled){box-shadow:0 4px 0 var(--b3d),0 7px 12px rgba(20,40,80,.22),inset 0 1px 0 rgba(255,255,255,.38)}
.rf-seg button[data-act=rprev]:not(:disabled){--b3d:#b07a3e;background:linear-gradient(180deg,#f2bf84,#e0a05c)}
.rf-seg button[data-act=rnext]:not(:disabled){--b3d:#2f8b8f;background:linear-gradient(180deg,#78d0d2,#4fb3b8)}
.rf-seg button:active:not(:disabled){transform:translateY(3px);background:revert-layer;box-shadow:0 1px 0 var(--b3d),0 2px 5px rgba(20,40,80,.22),inset 0 1px 0 rgba(255,255,255,.3)}
.rf-seg button[data-act=rprev]:active:not(:disabled){background:linear-gradient(180deg,#f2bf84,#e0a05c)}
.rf-seg button[data-act=rnext]:active:not(:disabled){background:linear-gradient(180deg,#78d0d2,#4fb3b8)}
.rf-seg button:disabled{background:rgba(255,255,255,.35)!important;color:rgba(255,255,255,.7)!important;box-shadow:none!important;opacity:.6}
/* Vitufe vya chini vya ripoti: saizi sawa, 3D tulivu */
.rf-bar{gap:10px!important}
.rfb,.rfb.ok{flex:1 1 0!important;min-width:0;height:58px;min-height:58px;flex-direction:column!important;gap:3px!important;padding:0 4px!important;font-size:.76rem!important;line-height:1.1;text-align:center!important;color:#fff!important;border:0;border-radius:15px;
  box-shadow:0 4px 0 var(--b3d),0 7px 12px rgba(20,40,80,.18),inset 0 1px 0 rgba(255,255,255,.38);
  text-shadow:0 1px 1px rgba(0,0,0,.18);transition:transform .08s ease,box-shadow .08s ease;-webkit-tap-highlight-color:transparent}
.rfb svg,.rfb.ok svg{width:21px;height:21px;flex:none}
.rfb i{font-size:1.15rem}
.rfb span,.rfb.ok span{white-space:nowrap}
.rfb.ok span{white-space:normal;line-height:1.05;font-size:.7rem}
.rfb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--b3d),0 2px 5px rgba(20,40,80,.18),inset 0 1px 0 rgba(255,255,255,.3)}
.rfb.pri{--b3d:#3e63a8;background:linear-gradient(180deg,#7ea6ea,#5b87d6)}
.rfb:not(.pri):not(.ok):not(.pu){--b3d:#b25d66;background:linear-gradient(180deg,#eb9ba3,#d97983)}
.rfb.ok{--b3d:#3b8a63;background:linear-gradient(180deg,#78cc9f,#52b183)}
.rfb.pu{--b3d:#6f58a8;background:linear-gradient(180deg,#b19ae6,#8f78d0)}
/* 3D nyepesi sana */
.rf-bar .rfb,.rf-bar .rfb.ok{box-shadow:0 2px 0 rgba(0,0,0,.14),0 3px 6px rgba(20,40,80,.10),inset 0 1px 0 rgba(255,255,255,.3)!important;box-shadow:0 2px 0 color-mix(in srgb,var(--b3d) 55%,transparent),0 3px 6px rgba(20,40,80,.10),inset 0 1px 0 rgba(255,255,255,.3)!important}
.rf-bar .rfb:active{transform:translateY(2px)!important;box-shadow:0 0 0 transparent,inset 0 1px 2px rgba(0,0,0,.12)!important}
/* Vitufe vya juu vya ripoti (rudi, <, >): 3D nyepesi laini kama vya chini */
.rf-top>.ibtn[data-act=back],.rf-seg button:not(:disabled){box-shadow:0 2px 0 color-mix(in srgb,var(--b3d) 55%,transparent),0 3px 6px rgba(20,40,80,.10),inset 0 1px 0 rgba(255,255,255,.3)!important;text-shadow:0 1px 1px rgba(0,0,0,.18);-webkit-tap-highlight-color:transparent}
.rf-top>.ibtn[data-act=back]:active,.rf-seg button:active:not(:disabled){transform:translateY(2px)!important;box-shadow:0 0 0 transparent,inset 0 1px 2px rgba(0,0,0,.12)!important}
/* Jina fupi la shule kwenye top bar, kulia */
.top-r{display:grid;justify-items:end;align-items:center;flex:none;max-width:50vw}
.top-r>*{grid-area:1/1}
.sch{font-size:.9rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:right;letter-spacing:.01em;transition:opacity .25s}

/* Bar ya chini: kubwa kidogo */
.nav button{min-height:68px;padding:10px 2px 8px;font-size:.8rem;gap:4px}

/* Kadi ya jina la shule (muonekano wa kisasa) */
.sch{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.38);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(15,23,80,.22),inset 0 1px 0 rgba(255,255,255,.35);font-size:inherit;max-width:100%;min-width:0}

.sch-ic.has-logo{padding:2px;box-sizing:border-box;overflow:hidden}
.sch-ic img{width:100%;height:100%;object-fit:contain;display:block;border-radius:10px}

.sch{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 1px 3px rgba(15,23,80,.12)}

/* ===== Kichagua Templeti cha Ripoti (kipya) ===== */
.tpcs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 4px}
.tpc{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px 12px;border:2px solid var(--bd);border-radius:18px;background:var(--card);text-align:center;color:var(--tx);transition:transform .15s,box-shadow .2s,border-color .2s}
.tpc:active{transform:scale(.97)}
.tpc.on{border-color:var(--k1);box-shadow:0 0 0 3px color-mix(in srgb,var(--k1) 22%,transparent),0 10px 22px color-mix(in srgb,var(--k2) 22%,transparent);background:color-mix(in srgb,var(--k1) 6%,var(--card))}
.tpc-ck{position:absolute;top:8px;right:8px;z-index:3;width:26px;height:26px;border-radius:50%;background:var(--k3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:0;transform:scale(.5);transition:all .2s}
.tpc.on .tpc-ck{opacity:1;transform:none}
.tpc-pv{width:100%;max-width:150px;border-radius:8px;overflow:hidden;box-shadow:0 4px 12px rgba(20,40,80,.22);background:#fff;line-height:0}
.tpc-nm{font-weight:800;font-size:1rem;color:var(--k2)}
.tpc-nm i{margin-right:4px;color:var(--k1)}
.tpc-ds{font-size:.76rem;line-height:1.3;color:var(--mut)}
.tp-pg{aspect-ratio:1/1.3;display:flex;flex-direction:column;gap:5%;padding:0 0 5%;line-height:0;background:#fff}
.tp-pg u,.tp-pg s,.tp-pg b{display:block;text-decoration:none}
.tp-hd{display:flex;align-items:center;gap:6%;padding:7% 7% 8%;background:linear-gradient(120deg,var(--k1),var(--k2) 60%,var(--k3));border-radius:0 0 14px 14px}
.tp-lg{flex:none;width:22%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.tp-ln{flex:1;display:flex;flex-direction:column;gap:5px}
.tp-ln u{height:4px;border-radius:3px;background:#fff}.tp-ln u+u{width:65%;opacity:.6;height:3px}
.tp-ti{height:6px;margin:0 22%;border-radius:3px;background:var(--k2)}
.tp-tb{margin:0 7%;display:flex;flex-direction:column;gap:3px}
.tp-tb b{height:5px;border-radius:2px;background:#dbe4f5}
.tp-tb b:first-child{background:var(--k2);height:7px}
.tp-tb b:nth-child(odd):not(:first-child){background:#eef2fb}
.tp-st{margin:0 7%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tp-st s{height:13px;border-radius:4px;background:var(--k1)}
.tp-st s:nth-child(2){background:var(--k3)}.tp-st s:nth-child(4){background:#f59e0b}
.tp-sn{margin:auto 7% 0;display:grid;grid-template-columns:1fr 1fr;gap:16%}
.tp-sn u{height:0;border-top:1.5px solid var(--k2)}
.tp-f{padding:6%;background:linear-gradient(160deg,#f5f0ff,#eaf4ff 55%,#fff4e6)}
.tp-fr{flex:1;display:flex;flex-direction:column;gap:5%;background:#fff;border:3px double #1e3a8a;outline:1.5px solid #d4a017;outline-offset:2px;padding:6% 0 5%}
.tp-f .tp-hd{flex-direction:column;background:none;border-radius:0;padding:0 0 6%;position:relative;gap:4px}
.tp-f .tp-hd::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,#1e3a8a,#7c3aed,#ec4899,#f59e0b,#10b981)}
.tp-f .tp-lg{width:20%;border-radius:0;background:#1e3a8a;box-shadow:0 0 0 2px #d4a017}
.tp-f .tp-ln{width:60%;align-items:center}.tp-f .tp-ln u{background:#1e3a8a;width:100%}.tp-f .tp-ln u+u{width:60%;background:#b8860b;opacity:1}
.tp-f .tp-ti{height:8px;margin:0 10%;border-radius:0;background:linear-gradient(90deg,#1e3a8a,#6d28d9,#be185d);border-top:1px solid #d4a017;border-bottom:1px solid #d4a017}
.tp-f .tp-tb b{background:#f0f9ff;border:.5px solid #d8cffa}.tp-f .tp-tb b:nth-child(even){background:#faf5ff}
.tp-f .tp-tb b:first-child{background:linear-gradient(90deg,#1e3a8a,#6d28d9);border:0}
.tp-f .tp-st s{border-radius:0}.tp-f .tp-st s:nth-child(1){background:#2563eb}.tp-f .tp-st s:nth-child(2){background:#10b981}.tp-f .tp-st s:nth-child(3){background:#f59e0b}.tp-f .tp-st s:nth-child(4){background:#ec4899}
.tp-f .tp-sn u{border-top-color:#6d28d9}

html,body{max-width:100%;overflow-x:clip}
#app,main{max-width:100%;min-width:0;overflow-x:clip}
.stats,.sxg{grid-template-columns:repeat(2,minmax(0,1fr))}
.gstats{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat,.sxt,.gstats>div,.sxg>*,.stats>*{min-width:0;max-width:100%}
.stat span,.sxt .sxn b,.sxt .sxn small{overflow-wrap:anywhere}
.stat.tap::after{animation:none}
.sxt{animation-fill-mode:backwards}
.sumpick,.setbar,.tablewrap{max-width:100%;min-width:0}
.sheet,.sheet.sx,.sheet.sx.wide{max-width:min(96vw,980px);min-width:0}
.sheet .mb{overflow-x:auto;overflow-y:auto;max-width:100%}
.dn,.dleg,.bars .brow,.stl,.podium{min-width:0;max-width:100%}

'Hatua 1: Weka taarifa za shule (mara moja tu)':'Step 1: Set up school details (only once)',

'Hatua 2: Anza matokeo mapya (sehemu zote unazojaza)':'Step 2: Start new results (all the parts you fill in)',
'<b>Kuanza</b>: gusa kitufe kikubwa cha <b>Ingiza Matokeo</b> kwenye Nyumbani, au <b>Matokeo Mapya</b> kwenye ukurasa wa Wanafunzi. Matokeo ya zamani yanabaki salama.':'<b>Start</b>: tap the big <b>Enter Results</b> button on Home, or <b>New Results</b> on the Students page. Old results stay safe.',
'<b>1. Darasa</b>: gusa darasa la 1 hadi 7. Darasa unalochagua ndilo linaamua masomo ya kawaida yatakayoonekana na mfumo wa alama unaoruhusiwa.':'<b>1. Class</b>: tap a class from 1 to 7. The class you choose decides the default subjects shown and the marking scheme allowed.',
'<b>2. Masomo</b>: masomo yenye tiki ndiyo yatakayotumika. Gusa somo kuliondoa au kulirudisha. Somo lisilopo? Andika jina lake kwenye kisanduku cha Somo jipya kisha gusa Ongeza Somo. Lazima abaki na angalau somo moja.':'<b>2. Subjects</b>: ticked subjects will be used. Tap a subject to remove or restore it. Missing a subject? Type its name in the New subject box, then tap Add Subject. At least one subject must remain.',
'<b>3. Mfumo wa alama</b>: chagua 100, 50 au 25 (25 ni kwa darasa la 1 na 2 tu). Hii ndiyo alama ya juu kabisa kwa kila somo. Alama inayozidi hapo haikubaliki, na madaraja yanatokana nayo. Chagua kwa makini kabla ya kuingiza alama.':'<b>3. Marking scheme</b>: choose 100, 50 or 25 (25 is for classes 1 and 2 only). This is the maximum mark for each subject. Marks above it are not accepted, and grades are based on it. Choose carefully before entering marks.',
'<b>4. Jina la mtihani</b>: chagua kutoka orodha (Muhula wa Kwanza, Nusu Muhula, Jaribio n.k.) au andika jina lako mwenyewe kwenye kisanduku cha Au andika jina lingine (hadi herufi 40). Jina hili ndilo litakalotoka kwenye kichwa cha ripoti na orodha.':'<b>4. Exam name</b>: choose from the list (First Term, Midterm, Test, etc.) or type your own name in the Or type another name box (up to 40 characters). This name appears in the report heading and the list.',
'<b>5. Mwaka wa masomo</b>: chagua mwaka. Darasa, mtihani na mwaka vilevile haviwezi kuhifadhiwa mara mbili.':'<b>5. Academic year</b>: choose the year. The same class, exam and year cannot be saved twice.',
'<b>6. Mwalimu wa darasa</b>: andika jina la mwalimu. Litaonekana chini ya ripoti. Ukiwa tayari umewahi kuanza matokeo ya darasa hilo, jina hujazwa lenyewe.':'<b>6. Class teacher</b>: type the teacher\'s name. It appears at the bottom of the report. If you have started results for that class before, the name is filled in automatically.',
'<b>7. Saini ya mwalimu</b>: gusa Pakia Saini, chagua picha ya saini kisha hakiki na ukate. Background ya saini inaondolewa yenyewe. Ukiruka sehemu hii, utaonyeshwa onyo wakati wa kuchapisha ripoti na utaweza kuiweka hapo hapo.':'<b>7. Teacher signature</b>: tap Upload Signature, choose a picture of the signature, then preview and crop. The signature background is removed automatically. If you skip this, you will get a warning when printing reports and can set it right there.',
'Mwisho gusa <b>Tengeneza Jedwali</b>.':'Finally tap <b>Create Table</b>.',
'Hatua 3: Weka wanafunzi (sehemu zote)':'Step 3: Add students (all the parts)',
'<b>Ongeza Mwanafunzi</b>: kitufe cha chini kwenye ukurasa wa Wanafunzi. Jaza <b>Jina</b> (linakuwa herufi kubwa lenyewe), chagua <b>Jinsi</b> (Kiume au Kike), kisha alama za kila somo. Gusa Hifadhi, au Anayefuata ili kuendelea na mwingine.':'<b>Add Student</b>: the bottom button on the Students page. Fill in <b>Name</b> (it becomes capitals automatically), choose <b>Gender</b> (Male or Female), then the marks for each subject. Tap Save, or Next to continue with another.',
'<b>Bandika majina</b>: bandika majina kutoka WhatsApp au Excel, jina moja kila mstari. Andika M au K mwisho wa jina (mfano ASHA JUMA K). Majina yasiyo na M wala K yatatokea kwenye orodha ya Chagua jinsi, na unagusa M au K kwa kila mmoja kabla ya kuongeza.':'<b>Paste names</b>: paste names from WhatsApp or Excel, one name per line. Type M or K at the end of the name (for example ASHA JUMA K). Names without M or K appear in the Select gender list, and you tap M or K for each one before adding.',
'<b>Bandika kutoka Excel</b>: unaweza kubandika pia jinsi na alama kwa mpangilio wa masomo yako. Andika - kwa somo ambalo mwanafunzi hakufanya.':'<b>Paste from Excel</b>: you can also paste gender and marks in the order of your subjects. Type - for a subject the student did not sit.',
'<b>Ingiza Haraka</b>: jedwali la kuandika wanafunzi wengi kwa mpigo (jina, jinsi na alama). Mistari tupu inapuuzwa.':'<b>Quick Entry</b>: a table for entering many students at once (name, gender and marks). Empty rows are ignored.',
'<b>Import from SIS</b>: chagua faili la Excel la SIS, majina yanaingia moja kwa moja. Faili lako asili halibadilishwi.':'<b>Import from SIS</b>: choose the SIS Excel file and the names are added directly. Your original file is not changed.',
'<b>Nakili majina</b>: chukua majina na jinsi kutoka matokeo mengine ya darasa hilo hilo. Alama zinabaki wazi.':'<b>Copy names</b>: take names and gender from other results of the same class. Marks stay blank.',
'Jumla ya wanafunzi, wavulana na wasichana inaonekana juu ya orodha ya Majina.':'The total number of students, boys and girls is shown at the top of the Names list.',
'Hatua 4: Ingiza alama':'Step 4: Enter marks',
'<b>Kwa mwanafunzi</b>: gusa jina lake kisha andika alama za masomo yote. Kibodi ya namba ya app ina vitufe +1, −1 na Hakufanya.':'<b>By student</b>: tap the student\'s name, then enter the marks for all subjects. The in-app number keypad has +1, −1 and Absent buttons.',
'<b>Ingiza/Hariri kwa somo</b>: gusa chip ya Ingiza/Hariri kwa somo, chagua somo juu, kisha andika alama za wanafunzi wote kwa somo hilo.':'<b>Enter/Edit by subject</b>: tap the Enter/Edit by subject chip, choose a subject at the top, then enter the marks of all students for that subject.',
'Mwanafunzi ambaye hajajazwa ana kisanduku chenye mpaka wa machungwa. Ukijaza, rangi inatoweka.':'A student who is not yet filled in has an orange-bordered box. Once you fill it in, the colour disappears.',
'Alama inayozidi kikomo inakuwa nyekundu na haihifadhiwi.':'A mark above the limit turns red and is not saved.',
'Mwanafunzi hakufanya somo? Andika "-" au gusa Hakufanya.':'Student did not sit the subject? Type "-" or tap Absent.',
'Kila kitu kinahifadhiwa papo hapo. Kishale kinaruka kwenda sehemu inayofuata (unaweza kukizima kwenye Muonekano na Uingizaji).':'Everything is saved instantly. The cursor jumps to the next field (you can turn this off in Appearance and Input).',
'Ukurasa wa Wanafunzi':'Students Page',
'<b>Tafuta</b>: andika jina kwenye kisanduku cha utafutaji.':'<b>Search</b>: type a name in the search box.',
'<b>Panga kwa nafasi</b>: orodha inapangwa kuanzia nafasi ya kwanza.':'<b>Sort by position</b>: the list is sorted starting from first position.',
'<b>Excel</b>: inapakua matokeo kama faili la Excel.':'<b>Excel</b>: downloads the results as an Excel file.',
'<b>Orodha</b>: inakupeleka kwenye matokeo yote yaliyohifadhiwa.':'<b>List</b>: takes you to all saved results.',
'Chini ya kila alama kuna daraja na nafasi ya somo.':'Under each mark there is the grade and the subject position.',
'Gusa jina la mwanafunzi kuhariri, kuona ripoti yake au kumfuta. Ukifuta kwa bahati mbaya, gusa TENGUA.':'Tap a student\'s name to edit, see their report or delete them. If you delete by mistake, tap UNDO.',
'Jina na saini ya mwalimu zikikosekana, utaonyeshwa onyo unapochapisha au kushiriki ripoti, na unaweza kuziweka hapo hapo.':'If the teacher\'s name and signature are missing, you will see a warning when printing or sharing reports, and you can set them right there.',
'Matokeo Yangu (Orodha)':'My Results (List)',
'Inaonyesha matokeo yote uliyohifadhi, kila moja na darasa, mtihani na mwaka wake.':'Shows all the results you have saved, each with its class, exam and year.',
'Gusa kadi kufungua seti hiyo. Unaweza pia kuifuta kutoka hapa.':'Tap a card to open that set. You can also delete it from here.',

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ic(n){return '<i class="fa-solid fa-'+n+'" aria-hidden="true"></i>';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function r2(n){return Math.round((n+Number.EPSILON)*100)/100;}
function clsName(c){return 'Darasa la '+c;}

/* ================= DATA ================= */
function defaults(){
  return {v:1,
    settings:{schoolName:'',address:'',phone:'',year:String(new Date().getFullYear()),exam:'Muhula wa Kwanza',teacher:'',head:'',logo:'',stamp:'',headSig:'',kp:'1',autoNext:'1',theme:'auto',repTpl:'blue',repLang:'en',lang:'sw',adminPin:''},
    sets:[],currentId:null,customSubjects:[],hiddenSubjects:[],users:[]};
}
function validSet(s){
  return s&&typeof s==='object'&&s.id&&Array.isArray(s.subjects)&&Array.isArray(s.students)&&(s.max===25||s.max===50||s.max===100);
}
function normalize(d){
  var b=defaults();
  if(!d||typeof d!=='object')return b;
  var k;
  if(d.settings&&typeof d.settings==='object'){for(k in b.settings){if(typeof d.settings[k]==='string')b.settings[k]=d.settings[k];}}
  b.sets=(Array.isArray(d.sets)?d.sets:[]).filter(validSet).map(function(s){
    s.students=s.students.filter(function(x){return x&&typeof x==='object';}).map(function(x){
      x.id=x.id||uid();x.name=String(x.name||'').toUpperCase();x.gender=x.gender==='M'?'M':'F';
      if(x.sisId!=null)x.sisId=String(x.sisId); else x.sisId='';
      if(x.premNumber!=null)x.premNumber=String(x.premNumber); else x.premNumber='';
      if(x.srn!=null)x.srn=String(x.srn); else x.srn='';
      x.marks=(x.marks&&typeof x.marks==='object')?x.marks:{};
      if(typeof x.comment!=='string')x.comment=null;
      return x;
    });
    s.cls=Number(s.cls)||1;s.exam=String(s.exam||'');s.year=String(s.year||'');s.month=String(s.month||'');s.day=String(s.day||'');
    return s;
  });
  b.customSubjects=Array.isArray(d.customSubjects)?d.customSubjects.filter(function(x){return typeof x==='string'&&!/^\s*learn\s*english\s*$/i.test(x);}):[];
  b.hiddenSubjects=Array.isArray(d.hiddenSubjects)?d.hiddenSubjects.filter(function(x){return typeof x==='string';}):[];
  b.users=(Array.isArray(d.users)?d.users:[]).filter(function(u){return u&&typeof u==='object'&&u.id&&String(u.name||'').trim();}).map(function(u){
    var cl=(Array.isArray(u.classes)?u.classes:[]).map(Number).filter(function(c){return c>=1&&c<=7;});
    return {id:String(u.id),name:String(u.name).trim().slice(0,60),pin:String(u.pin==null?'':u.pin),role:['teacher','head','viewer'].indexOf(u.role)>=0?u.role:'teacher',last:Number(u.last)||0,classes:cl.filter(function(c,i){return cl.indexOf(c)===i;}).sort()};
  });
  b.currentId=b.sets.some(function(s){return s.id===d.currentId;})?d.currentId:(b.sets[0]?b.sets[0].id:null);
  return b;
}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw));}catch(e){}
  return defaults();
}
var DB=load();
/* ===== Watumiaji (Walimu) na Kuingia ===== */
var HIDDEN=[],AUTH=null,AKEY='resulthub_auth_v1',USR=null;
function isTeacher(){return !!(AUTH&&AUTH.role==='teacher');}
function userById(id){for(var i=0;i<DB.users.length;i++){if(DB.users[i].id===id)return DB.users[i];}return null;}
function myUser(){return isTeacher()?userById(AUTH.id):null;}
var ROLES={
  teacher:{n:'Mwalimu wa Darasa',i:'chalkboard-user',all:false,p:'edit print',d:'Anaingiza na kuhariri alama za madarasa aliyopewa tu.'},
  head:{n:'Mwalimu wa Taaluma',i:'user-tie',all:true,p:'edit print backup',d:'Anaona madarasa yote, anahariri na ana Backup. Hasimamii watumiaji wala mipangilio ya shule.'},
  viewer:{n:'Mtazamaji (kusoma tu)',i:'eye',all:false,p:'print',d:'Anaona na kuchapisha madarasa aliyopewa. Hawezi kubadilisha chochote.'}};
function urole(){var u=myUser();return u?(ROLES[u.role]?u.role:'teacher'):'admin';}
function can(x){if(!AUTH||AUTH.role==='admin')return true;return (' '+ROLES[urole()].p+' ').indexOf(' '+x+' ')>=0;}
function scoped(){return isTeacher()&&!ROLES[urole()].all;}
function allowedClasses(){var u=myUser();return scoped()?(u.classes||[]).map(Number):CFG.classes.slice();}
function applyScope(){
  if(HIDDEN.length){DB.sets=HIDDEN.concat(DB.sets);HIDDEN=[];}
  if(scoped()){
    var al=allowedClasses();
    HIDDEN=DB.sets.filter(function(x){return al.indexOf(Number(x.cls))<0;});
    DB.sets=DB.sets.filter(function(x){return al.indexOf(Number(x.cls))>=0;});
    if(!cur())DB.currentId=DB.sets[0]?DB.sets[0].id:null;
  }
}
function setAuth(a){
  AUTH=a;idleReset();
  if(a&&a.role==='admin'){try{pushTeachers();}catch(e){}}
  try{if(a)localStorage.setItem(AKEY,JSON.stringify(a));else localStorage.removeItem(AKEY);}catch(e){}
  applyScope();
}
function initAuth(){
  var a=null;try{a=JSON.parse(localStorage.getItem(AKEY)||'null');}catch(e){}
  if(!DB.users.length){AUTH=null;try{localStorage.removeItem(AKEY);}catch(e){}return;}
  if(a&&a.role==='admin')AUTH={role:'admin'};
  else if(a&&a.role==='teacher'&&userById(a.id))AUTH={role:'teacher',id:a.id};
  else AUTH=null;
  applyScope();
}
function initials(n){var w=String(n||'').replace(/^(mwl\.?|mwalimu|mr\.?|mrs\.?|ms\.?)\s+/i,'').trim().split(/\s+/).filter(Boolean);if(!w.length)return '?';return ((w[0][0]||'')+(w.length>1?w[w.length-1][0]:'')).toUpperCase();}
function fmtLast(t){if(!t)return 'Hajaingia bado';try{return 'Aliingia: '+new Date(t).toLocaleDateString();}catch(e){return '';}}

  var opts='<option value="admin">Admin (Mkuu wa Shule)</option>'+DB.users.map(function(u){return '<option value="'+esc(u.id)+'">'+esc(u.name)+'</option>';}).join('');

    '<div class="lg-body"><h2 class="lg-h">Ingia kwenye Mfumo</h2><p class="lg-p">Chagua jina lako kisha weka neno siri.</p>'+

function renderLogin(){
  $('#top').innerHTML='';$('#main').className='';$('#main').innerHTML=loginHTML();
  $('#nav').innerHTML='';$('#fab').innerHTML='';
  try{I18N.scan(document.body);}catch(e){}

function lockLeft(){try{var l=JSON.parse(localStorage.getItem('resulthub_lock')||'null');return l&&l.u>Date.now()?Math.ceil((l.u-Date.now())/1000):0;}catch(e){return 0;}}
function lockFail(){try{var l=JSON.parse(localStorage.getItem('resulthub_lock')||'null')||{n:0,u:0};l.n++;if(l.n>=5)l.u=Date.now()+30000*Math.pow(2,Math.min(l.n-5,4));localStorage.setItem('resulthub_lock',JSON.stringify(l));}catch(e){}}
function lockClear(){try{localStorage.removeItem('resulthub_lock');}catch(e){}}

function rhHash(x){
  if(window.crypto&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)).then(function(b){return Array.from(new Uint8Array(b)).map(function(y){return y.toString(16).padStart(2,'0')}).join('');});}
  return Promise.resolve(btoa(unescape(encodeURIComponent(x))));
}
function adminGateOk(pw){
  var us={};try{us=JSON.parse(localStorage.getItem('kd_users'))||{};}catch(e){}
  var k=Object.keys(us)[0];if(!k)return Promise.resolve(false);
  return rhHash(pw).then(function(h){return us[k].pass===h;});
}
function afterLogin(){
  lockClear();
  screen='home';VIEW='names';NCLS=null;W=null;
  render();window.scrollTo(0,0);
  toast(isTeacher()?'Karibu, '+myUser().name+'.':'Karibu, Admin.');
}
function failLogin(){lockFail();var lk2=lockLeft();$('#lgErr').textContent=lk2?'Umejaribu mara nyingi. Subiri sekunde '+lk2+'.':'Neno siri si sahihi. Jaribu tena.';try{buzz([60,40,60]);}catch(e){}}
window.gateAdmin=function(){if(DB.users.length&&!AUTH){setAuth({role:'admin'});render();}};
function doLogin(){
  var lu=$('#lgUser').value,lp=$('#lgPin').value.trim(),ok=false,lk=lockLeft();
  if(lk){$('#lgErr').textContent='Umejaribu mara nyingi. Subiri sekunde '+lk+' kisha ujaribu tena.';return;}
  if(lu==='admin'){adminGateOk(lp).then(function(g){if(g){setAuth({role:'admin'});afterLogin();}else failLogin();});return;}
  else{var uu=userById(lu);ok=!!uu&&String(uu.pin)===lp;if(ok){uu.last=Date.now();setAuth({role:'teacher',id:uu.id});save();}}
  if(!ok){lockFail();var lk2=lockLeft();$('#lgErr').textContent=lk2?'Umejaribu mara nyingi. Subiri sekunde '+lk2+'.':'Neno siri si sahihi. Jaribu tena.';try{buzz([60,40,60]);}catch(e){}return;}
  lockClear();
  screen='home';VIEW='names';NCLS=null;W=null;
  render();window.scrollTo(0,0);
  toast(isTeacher()?'Karibu, '+myUser().name+'.':'Karibu, Admin.');
}
var IDLE_MS=10*60*1000,idleT=null;
function idleReset(){clearTimeout(idleT);if(AUTH&&DB.users.length)idleT=setTimeout(function(){save();closeModal();setAuth(null);screen='home';VIEW='names';NCLS=null;W=null;render();toast('Umetolewa kwa kutokuwa na shughuli. Ingia tena.');},IDLE_MS);}
['click','touchstart','keydown'].forEach(function(ev){document.addEventListener(ev,idleReset,{passive:true});});
function doLogout(){
  confirmBox('Unataka kutoka kwenye akaunti hii?','TOKA',function(){
    save();closeModal();setAuth(null);
    if(!DB.users.length){try{localStorage.removeItem('kd_session');}catch(e){}location.reload();return;}
    screen='home';VIEW='names';NCLS=null;W=null;
    render();window.scrollTo(0,0);
  });
}

function usersShow(){
  var sh=document.querySelector('#modalRoot .sheet');
  if(MODKIND==='users'&&sh){sh.innerHTML='<span class="uph" hidden></span>'+usersHTML();}
  else{showModal('<span class="uph" hidden></span>'+usersHTML());MODKIND='users';}
  try{I18N.scan(document.getElementById('modalRoot'));}catch(e){}
}
function usersOpen(){USR={view:'list'};usersShow();}
function uCapture(){if(!USR)return;var a=$('#uName'),b=$('#uPin');if(a)USR.name=a.value;if(b)USR.pin=b.value;}
function usersAct(act,d){
  if(!USR)USR={view:'list'};
  var er=function(m){var e=$('#uErr');if(e)e.textContent=m;};
  switch(act){
    case 'uadd':USR={view:'form',id:'',name:'',pin:'',role:'teacher',classes:[]};usersShow();break;
    case 'uedit':var x=userById(d.id);if(!x)break;USR={view:'form',id:x.id,name:x.name,pin:x.pin,role:x.role||'teacher',classes:(x.classes||[]).slice()};usersShow();break;
    case 'upinopen':USR={view:'pin'};usersShow();break;
    case 'urole':uCapture();USR.role=d.v;usersShow();break;
    case 'uback':USR={view:'list'};usersShow();break;
    case 'ureveal':USR.rev=USR.rev||{};USR.rev[d.id]=!USR.rev[d.id];usersShow();break;
    case 'ucls':
      uCapture();var c=Number(d.v),i=USR.classes.indexOf(c);
      if(i>=0)USR.classes.splice(i,1);else USR.classes.push(c);
      USR.classes.sort();usersShow();break;
    case 'usave':
      uCapture();
      var nm=String(USR.name||'').replace(/\s+/g,' ').trim(),pn=String(USR.pin||'').trim();
      if(!nm){er('Tafadhali weka jina la mwalimu.');break;}
      if(pn.length<4||pn.length>20){er('Neno siri liwe herufi au namba 4 hadi 20.');break;}
      if(USR.role!=='head'&&!USR.classes.length){er('Chagua angalau darasa moja.');break;}
      if(DB.users.some(function(o){return o.id!==USR.id&&o.name.toLowerCase()===nm.toLowerCase();})){er('Jina hili tayari limesajiliwa.');break;}
      var first=!DB.users.length;
      if(USR.id){var ex=userById(USR.id);if(ex){ex.name=nm;ex.pin=pn;ex.role=USR.role||'teacher';ex.classes=USR.classes.slice().sort();}}
      else DB.users.push({id:uid(),name:nm,pin:pn,role:USR.role||'teacher',last:0,classes:USR.classes.slice().sort()});
      save();
      if(first)setAuth({role:'admin'});
      USR={view:'list'};usersShow();render();toast('Mwalimu amehifadhiwa.');break;
    case 'upinsave':
      var a1=($('#aPin').value||'').trim();
      if(a1.length<4||a1.length>20){er('Neno siri liwe herufi au namba 4 hadi 20.');break;}
      DB.settings.adminPin=a1;save();USR={view:'list'};usersShow();toast('Neno siri la Admin limehifadhiwa.');break;
    case 'udel':
      var du=userById(d.id);if(!du)break;
      confirmBox('Futa mwalimu '+du.name+'? Matokeo aliyoingiza hayafutwi.','FUTA',function(){
        DB.users=DB.users.filter(function(o){return o.id!==du.id;});
        if(!DB.users.length)setAuth(null);
        save();USR={view:'list'};closeModal();usersShow();render();toast('Mwalimu ameondolewa.');
      },true);break;
  }
}

/* ================= CALCULATIONS ================= */
function gradeOf(v,max){
  var t=CFG.thresholds[max];
  for(var i=0;i<t.length;i++){if(v>=t[i][0])return t[i][1];}
  return 'E';
}
/* Darasa la 7: daraja la mwanafunzi kwa JUMLA ya alama (masomo 6 x 50 = 300): A 241+, B 181+, C 121+, D 61+, E 0+ */
function c7Thr(set){var k=(set.subjects.length*set.max)/300;return [[241*k,'A'],[181*k,'B'],[121*k,'C'],[61*k,'D']];}
function overallGrade(set,avg){
  if(Number(set.cls)!==7)return gradeOf(avg,set.max);
  var total=avg*set.subjects.length,t=c7Thr(set);
  for(var i=0;i<t.length;i++){if(total>=t[i][0]-1e-9)return t[i][1];}
  return 'E';
}
function isPass(set,avg){
  if(Number(set.cls)!==7)return avg>=set.max*CFG.passPercent/100;
  return avg*set.subjects.length>=c7Thr(set)[2][0]-1e-9;
}
/* Masomo ya msingi kwa kuvunja sare ya nafasi */
function isCoreSub(name){return /hesab|hisabati|math|english|kiingereza|sayansi|science|kiswahili|swahili|kusoma|kuandika|reading|writing/i.test(String(name||''));}
function calc(set){
  var n=set.subjects.length;
  var rows=set.students.map(function(s){
    var total=0,taken=0;
    /* Wastani hugawanywa kwa masomo YOTE ya darasa (mfano masomo 6, amefanya 3 => jumla / 6). Somo ambalo hakufanya au halijajazwa linahesabiwa 0. */
    set.subjects.forEach(function(sub){total+=Number(s.marks[sub])||0;if(s.marks[sub]!==null)taken++;});
    total=r2(total);
    var avg=n?r2(total/n):0;
    /* Kuvunja sare: jumla ya masomo ya msingi (hisabati/kuhesabu, English, sayansi, Kiswahili) kisha masomo mengine */
    var core=0,oth=0;
    set.subjects.forEach(function(sub){var v=Number(s.marks[sub])||0;if(isCoreSub(sub))core+=v;else oth+=v;});
    return {s:s,total:total,avg:avg,core:r2(core),oth:r2(oth),grade:overallGrade(set,avg),pass:isPass(set,avg),pos:0};
  });
  /* Nafasi: kwanza kwa wastani; wakilingana, masomo ya msingi; wakilingana tena, masomo mengine; wakilingana kote wanapata nafasi sawa (1,2,2,4) */
  var cmp=function(a,b){return (b.avg-a.avg)||(b.core-a.core)||(b.oth-a.oth);};
  var sorted=rows.slice().sort(cmp);
  sorted.forEach(function(r,i){r.pos=(i>0&&cmp(r,sorted[i-1])===0)?sorted[i-1].pos:i+1;});
  rows.forEach(function(r){r.sp={};r.sg={};});
  set.subjects.forEach(function(sj){
    var val=function(r){var v=r.s.marks[sj];return v==null?-1:(Number(v)||0);};
    var ss=rows.slice().sort(function(a,b){return val(b)-val(a);});
    ss.forEach(function(r,i){
      var m=val(r);
      if(m<0){r.sp[sj]='-';r.sg[sj]='-';return;}
      r.sp[sj]=(i>0&&m===val(ss[i-1]))?ss[i-1].sp[sj]:i+1;
      r.sg[sj]=gradeOf(m,set.max);
    });
  });
  return rows;
}
/* Waliofanya mtihani = mwenye angalau somo moja lenye alama. Wastani wa darasa na madaraja huhesabiwa kwa hawa tu. */
function satRows(set,rows){return rows.filter(function(r){return set.subjects.some(function(sj){return r.s.marks[sj]!=null;});});}
function checkMark(v,max,name){
  v=String(v==null?'':v).trim().replace(',','.');
  if(v==='')return {e:(name?'Weka alama ya '+name+'. Kama hakufanya, andika "-".':'Weka alama. Kama hakufanya, andika "-".')};
  if(v==='-'||/^h$/i.test(v))return {n:null};
  if(!/^-?\d+(\.\d+)?$/.test(v))return {e:(name?'Andika namba tu kwa '+name+', mfano 35 au 35.5. Kama hakufanya, andika "-".':'Andika namba tu, mfano 35 au 35.5. Kama hakufanya, andika "-".')};
  var n=parseFloat(v);
  if(n<0)return {e:'Alama haiwezi kuwa chini ya 0. Weka namba kuanzia 0.'};
  if(n>max)return {e:'Umeandika '+n+', lakini alama ya juu ni '+max+'. Rekebisha namba.'};
  return {n:n};
}

function gradeKeyHTML(max){
  var t=CFG.thresholds[max],out=[],prev=max;
  t.forEach(function(x){out.push('<b class="kl">'+x[1]+'</b> = '+esc(CFG.gradeDesc[x[1]])+' ('+x[0]+'–'+prev+')');prev=x[0]-1;});

/* Ufunguo wa madaraja kwa mistari miwili: A,B,C juu; D,E chini */
function gradeKeyRows(max){
  var t=CFG.thresholds[max],out=[],prev=max;
  t.forEach(function(x){out.push('<b class="kl">'+x[1]+'</b> = '+esc(CFG.gradeDesc[x[1]])+' ('+x[0]+'–'+prev+')');prev=x[0]-1;});
  var k=Math.ceil(out.length/2);
  return [out.slice(0,k).join(' · '),out.slice(k).join(' · ')];
}

function hsCount(el,from,to,dec,suf){
  if(!el)return;
  var t0=null,dur=700;
  function step(ts){
    if(t0===null)t0=ts;
    var k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=(from+(to-from)*e).toFixed(dec)+suf;
    if(k<1)requestAnimationFrame(step);else el.textContent=to.toFixed(dec)+suf;
  }
  requestAnimationFrame(step);
}

  HS.n=d.n;HS.a=d.a;HS.p=d.p;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function apply(){
    var t=document.getElementById('hst'),dt=document.getElementById('hsd');
    if(t)t.innerHTML=ic('folder-open')+' '+esc(d.t);
    if(dt)dt.outerHTML=hsDots(list.length);

      var n=document.getElementById('hsn'),a=document.getElementById('hsa'),p=document.getElementById('hsp');
      if(n)n.textContent=d.n;if(a)a.textContent=d.a.toFixed(1);if(p)p.textContent=d.p+'%';
      return;
    }
    hsCount(document.getElementById('hsn'),0,d.n,0,'');
    hsCount(document.getElementById('hsa'),0,d.a,1,'');
    hsCount(document.getElementById('hsp'),0,d.p,0,'%');

  if(reduce||!w.animate){apply();return;}
  var out=w.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX(-40px)',opacity:0}],{duration:220,easing:'ease-in',fill:'forwards'});
  out.onfinish=function(){
    apply();
    w.animate([{transform:'translateX(40px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:320,easing:'ease-out'});
    out.cancel();

function riskList(set){
  var weakG={D:1,E:1},out=[];
  calc(set).forEach(function(r){
    var sat=set.subjects.some(function(sj){return r.s.marks[sj]!=null;});
    if(!sat||set.subjects.some(function(sj){var v=r.s.marks[sj];return v===undefined||v==='';}))return;
    var weak=set.subjects.filter(function(sj){return r.s.marks[sj]!=null&&weakG[r.sg[sj]];});
    if(weakG[r.grade]||weak.length>=3)out.push({r:r,weak:weak});
  });
  out.sort(function(a,b){return (b.weak.length-a.weak.length)||(a.r.avg-b.r.avg);});
  return out;
}

function fitTable(){
  var w=$('#tw');if(!w)return;
  var t=w.querySelector('table.rt');
  w.style.height='';w.style.overflow='';
  if(!t)return;
  t.style.transform='';
  var avail=w.clientWidth,need=t.offsetWidth;
  if(!avail||need<=avail+1)return;
  var k=avail/need;
  if(k<0.5){k=0.5;w.style.overflow='auto';}else{w.style.overflow='hidden';}
  t.style.transform='scale('+k+')';
  w.style.height=(Math.ceil(t.offsetHeight*k)+2)+'px';
}

var ENT={};
function entGet(set){
  if(!set)return {all:true,subs:[]};
  if(!ENT[set.id]){
    var v=null;try{v=JSON.parse(localStorage.getItem('rh_ent_'+set.id)||'null');}catch(e){}
    ENT[set.id]=(v&&typeof v==='object')?{all:v.all!==false,subs:(v.subs||[]).filter(function(i){return i>=0&&i<set.subjects.length;})}:{all:true,subs:[]};
  }
  return ENT[set.id];
}
function entSave(set){try{localStorage.setItem('rh_ent_'+set.id,JSON.stringify(ENT[set.id]));}catch(e){}}
function entOn(set,i){var e=entGet(set);return e.all||e.subs.indexOf(Number(i))>=0;}
function entBox(set){
  var e=entGet(set);
  return '<div class="entbox" id="entBox"><div class="entrow"><div><b>Naingiza masomo yote</b><small>'+(e.all?'Imewashwa: masomo yote yanaonekana':'Imezimwa: chagua masomo yako tu')+'</small></div>'+
    '<button type="button" class="entsw'+(e.all?' on':'')+'" data-act="entall" role="switch" aria-checked="'+(e.all?'true':'false')+'" aria-label="Masomo yote"><i></i></button></div>'+
    (e.all?'':'<div class="entchips">'+set.subjects.map(function(x,i){return '<button type="button" class="chip'+(e.subs.indexOf(i)>=0?' on':'')+'" data-act="entsub" data-i="'+i+'">'+esc(shortSub(x))+'</button>';}).join('')+'</div>'+(e.subs.length?'':'<small style="display:block;margin-top:8px;color:#b45309">Gusa somo unalofundisha ili lionekane.</small>'))+'</div>';
}
function entApply(){
  var set=cur();if(!set)return;
  $$('[data-ec]').forEach(function(el){el.classList.toggle('entoff',!entOn(set,el.getAttribute('data-ec')));});
  var b=$('#entBox');if(b)b.outerHTML=entBox(set);

function entShow(set,i){var e=entGet(set);if(!e.all&&e.subs.indexOf(Number(i))<0){e.subs.push(Number(i));entSave(set);}}

function latestSets(){
  var m={};
  DB.sets.forEach(function(x){if(!x.students.length)return;var c=Number(x.cls);if(!m[c]||(x.created||0)>(m[c].created||0))m[c]=x;});
  return Object.keys(m).map(Number).sort(function(a,b){return a-b;}).map(function(c){return m[c];});
}
function ensureLatest(){
  var set=cur();if(!set)return;
  var l=latestSets().filter(function(x){return Number(x.cls)===Number(set.cls);})[0];
  if(l&&l.id!==DB.currentId){DB.currentId=l.id;save();}
  else if(!l){var f=latestSets()[0];if(f){DB.currentId=f.id;save();}}
}
