/* ===== Tathmini ya Kina (muhtasari) ===== */
function tmCnt(list){
  var m=0,f=0;list.forEach(function(x){if(x.m)m++;else f++;});
  return {m:m,f:f,t:m+f};
}
function tmTri(c){return '<td>'+c.m+'</td><td>'+c.f+'</td><td class="tj">'+c.t+'</td>';}
function tmPct(a,b){return b?String(Math.round(a/b*1000)/10).replace(/\.0$/,''):'0';}
function tmHead3(label,cls){return '<th colspan="3"'+(cls?' class="'+cls+'"':'')+'>'+label+'</th>';}
function tmSub3(n){var o='';for(var i=0;i<n;i++)o+='<th>WAV</th><th>WAS</th><th>JML</th>';return o;}
function tmRow(label,reg,done,gl,avg,max,withPct){
  // reg/done: [{m:bool}] ; gl: {A:[{m}],..}
  var cR=tmCnt(reg),cD=tmCnt(done),G={};
  ['A','B','C','D','E'].forEach(function(g){G[g]=tmCnt(gl[g]);});
  var AC=tmCnt(gl.A.concat(gl.B,gl.C)),DE=tmCnt(gl.D.concat(gl.E));
  var h='<tr><td class="tl">'+esc(label)+'</td>'+tmTri(cR)+tmTri(cD);
  if(withPct)h+='<td class="tp">'+tmPct(cD.t,cR.t)+'</td>';
  ['A','B','C'].forEach(function(g){h+=tmTri(G[g]);if(withPct)h+='<td class="tp">'+tmPct(G[g].t,cD.t)+'</td>';});
  h+=tmTri(AC)+'<td class="tp">'+tmPct(AC.t,cD.t)+'</td>';
  ['D','E'].forEach(function(g){h+=tmTri(G[g]);if(withPct)h+='<td class="tp">'+tmPct(G[g].t,cD.t)+'</td>';});
  h+=tmTri(DE)+'<td class="tp">'+tmPct(DE.t,cD.t)+'</td>';
  h+='<td class="tj">'+avg.toFixed(2)+'</td><td class="tp">'+tmPct(avg,max)+'</td></tr>';
  return h;
}
function tathminiHTML(set,rows,onlyInner){
  var mx=set.max;
  // --- Jedwali 1: matokeo ya jumla ya darasa (kwa daraja la wastani la mwanafunzi)
  var reg=rows.map(function(r){return {m:r.s.gender==='M'};});
  var doneR=rows.filter(function(r){return set.subjects.some(function(sj){return r.s.marks[sj]!=null;});});
  var done=doneR.map(function(r){return {m:r.s.gender==='M'};});
  var gl={A:[],B:[],C:[],D:[],E:[]};
  doneR.forEach(function(r){gl[r.grade].push({m:r.s.gender==='M'});});
  var cAvg=doneR.length?r2(doneR.reduce(function(a,r){return a+r.avg;},0)/doneR.length):0;
  var t1='<div class="tablewrap"><table class="tm"><thead>'+
    '<tr><th rowspan="2" class="tl">DARASA</th>'+tmHead3('WALIOSAJILIWA')+tmHead3('WALIOFANYA')+tmHead3('A')+tmHead3('B')+tmHead3('C')+tmHead3('A hadi C')+'<th rowspan="2">%<br>A hadi C</th>'+tmHead3('D')+tmHead3('E')+tmHead3('D hadi E')+'<th rowspan="2">%<br>D hadi E</th><th rowspan="2">WASTANI</th><th rowspan="2">ASILIMIA</th></tr>'+
    '<tr>'+tmSub3(9).replace(/$/,'')+'</tr></thead><tbody>';
  // tengeneza safu ya jedwali 1 bila % za kila daraja
  var cR=tmCnt(reg),cD=tmCnt(done),G={};
  ['A','B','C','D','E'].forEach(function(g){G[g]=tmCnt(gl[g]);});
  var AC=tmCnt(gl.A.concat(gl.B,gl.C)),DE=tmCnt(gl.D.concat(gl.E));
  t1+='<tr><td class="tl">'+esc(clsName(set.cls))+'</td>'+tmTri(cR)+tmTri(cD)+tmTri(G.A)+tmTri(G.B)+tmTri(G.C)+tmTri(AC)+'<td class="tp">'+tmPct(AC.t,cD.t)+'</td>'+tmTri(G.D)+tmTri(G.E)+tmTri(DE)+'<td class="tp">'+tmPct(DE.t,cD.t)+'</td><td class="tj">'+cAvg.toFixed(2)+'</td><td class="tp">'+tmPct(cAvg,mx)+'</td></tr></tbody></table></div>';
  // --- Jedwali 2: uchambuzi wa madaraja kimasomo
  var t2='<div class="tablewrap"><table class="tm"><thead><tr><th rowspan="2" class="tl">SOMO</th>'+tmHead3('WALIOSAJILIWA')+tmHead3('WALIOFANYA')+'<th rowspan="2">%</th>'+
    tmHead3('A')+'<th rowspan="2">%</th>'+tmHead3('B')+'<th rowspan="2">%</th>'+tmHead3('C')+'<th rowspan="2">%</th>'+tmHead3('A hadi C')+'<th rowspan="2">%</th>'+tmHead3('D')+'<th rowspan="2">%</th>'+tmHead3('E')+'<th rowspan="2">%</th>'+tmHead3('D hadi E')+'<th rowspan="2">%</th><th rowspan="2">WASTANI</th><th rowspan="2">ASILIMIA</th></tr><tr>'+tmSub3(9)+'</tr></thead><tbody>';
  set.subjects.forEach(function(sj){
    var dn=rows.filter(function(r){return r.s.marks[sj]!=null;});
    var g2={A:[],B:[],C:[],D:[],E:[]},tot=0;
    dn.forEach(function(r){var v=Number(r.s.marks[sj])||0;tot+=v;g2[gradeOf(v,mx)].push({m:r.s.gender==='M'});});
    var av=dn.length?r2(tot/dn.length):0;
    t2+=tmRow(sj,reg,dn.map(function(r){return {m:r.s.gender==='M'};}),g2,av,mx,true);
  });
  t2+='</tbody></table></div>';
  if(onlyInner)return '<div id="tmCard"><div class="tmh" style="justify-content:flex-end"><button class="btn ghost sm" data-act="printtm">'+ic('print')+' Chapisha</button></div>'+
    '<small class="tmn">WAV = Wavulana · WAS = Wasichana · JML = Jumla · A hadi C = Ufaulu · D hadi E = Ufaulu hafifu</small>'+
    '<div class="tmt">TATHMINI YA MATOKEO YA DARASA '+esc(examDateTxt(set))+'</div>'+t1+
    '<div class="tmt">UCHAMBUZI WA MADARAJA KIMASOMO</div>'+t2+'</div>';
  return '<div class="card tmcard" id="tmCard"><div class="tmh"><b>TATHMINI YA KINA</b><button class="btn ghost sm" data-act="printtm">'+ic('print')+' Chapisha</button></div>'+
    '<small class="tmn">WAV = Wavulana · WAS = Wasichana · JML = Jumla · A hadi C = Ufaulu · D hadi E = Ufaulu hafifu</small>'+
    '<div class="tmt">TATHMINI YA MATOKEO YA DARASA '+esc(examDateTxt(set))+'</div>'+t1+
    '<div class="tmt">UCHAMBUZI WA MADARAJA KIMASOMO</div>'+t2+'</div>';
}

var SUMK='',SUMF='pass';
function sumListInner(){
  var set=cur();if(!set)return '';
  var rows=calc(set),k=SUMK,gen=(k==='M'||k==='F');
  var titles={all:'Wanafunzi Wote',pass:'Waliofaulu',fail:'Waliofeli',M:'Wavulana',F:'Wasichana'};
  var list=rows.slice();
  if(k==='pass')list=list.filter(function(r){return r.pass;});
  var satIds={};satRows(set,rows).forEach(function(r){satIds[r.s.id]=1;});
  if(k==='fail')list=list.filter(function(r){return !r.pass&&satIds[r.s.id];});
  var chips='';
  if(gen){
    var base=rows.filter(function(r){return (r.s.gender==='M')===(k==='M');});
    var np=base.filter(function(r){return r.pass;}).length,nf=base.filter(function(r){return !r.pass&&satIds[r.s.id];}).length;
    list=base.filter(function(r){return SUMF==='all'||(SUMF==='pass'?r.pass:(!r.pass&&satIds[r.s.id]));});
    chips='<div class="sfl">'+[['pass','Waliofaulu',np],['fail','Waliofeli',nf],['all','Wote',base.length]].map(function(c){
      return '<button type="button" class="chip'+(SUMF===c[0]?' on':'')+'" data-act="sumf" data-v="'+c[0]+'">'+c[1]+' ('+c[2]+')</button>';}).join('')+'</div>';
  }
  var showMarks=gen||k==='fail',showTot=k!=='all';
  function row(r,i){
    var h='<div class="sr"><div class="srt"><span class="sn">'+(i+1)+'</span><span class="sm">'+esc(r.s.name)+'</span>'+
      '<span class="ngd '+(r.s.gender==='M'?'m':'f')+'">'+(r.s.gender==='M'?'M':'K')+'</span>'+
      (showTot?'<span class="st">Jumla<br><b>'+r.total+'</b></span>':'')+'</div>';
    if(showMarks){
      h+='<div class="smk">'+set.subjects.map(function(sj){var v=r.s.marks[sj];return '<span><em>'+esc(shortSub(sj))+'</em><b>'+(v==null||v===''?'-':esc(v))+'</b></span>';}).join('')+
        '<span><em>Wastani</em><b>'+r.avg.toFixed(2)+'</b></span></div>';
    }
    return h+'</div>';
  }
  var body='';
  if(!list.length){
    body='<div class="empty">'+ic('users')+'Hakuna wanafunzi kwenye orodha hii.</div>';
  }else if(gen){

 ['house','Menyu ya chini (vitufe 5)',[
  '<b>Nyumbani</b>: takwimu za haraka, slide ya madarasa na kitufe kikubwa cha Ingiza Matokeo.',
  '<b>Wanafunzi</b>: orodha ya wanafunzi na alama zao za darasa lililochaguliwa.',
  '<b>Muhtasari</b>: wastani wa darasa, ufaulu, madaraja na wanafunzi bora.',
  '<b>Ripoti</b>: ripoti ya kila mwanafunzi na uchapishaji.',
  '<b>Mipangilio</b>: taarifa za shule, muonekano, backup na maelezo haya.']],
 ['school','Hatua 1: Weka taarifa za shule (mara moja tu)',[
  'Fungua Mipangilio kisha kundi la <b>Shule</b>.',
  'Jaza jina la shule, anwani, namba ya simu na jina la Mwalimu Mkuu.',
  'Pakia <b>Nembo</b>, <b>Muhuri</b> na <b>Saini ya Mwalimu Mkuu</b>. Utahakiki na kurekebisha picha kabla ya kuhifadhi.',
  'Vitu hivi vitaonekana kwenye ripoti zote.']],
 ['graduation-cap','Hatua 2: Anza matokeo mapya (sehemu zote unazojaza)',[
  '<b>Kuanza</b>: gusa kitufe kikubwa cha <b>Ingiza Matokeo</b> kwenye Nyumbani, au <b>Matokeo Mapya</b> kwenye ukurasa wa Wanafunzi. Matokeo ya zamani yanabaki salama.',
  '<b>1. Darasa</b>: gusa darasa la 1 hadi 7. Darasa unalochagua ndilo linaamua masomo ya kawaida yatakayoonekana na mfumo wa alama unaoruhusiwa.',
  '<b>2. Masomo</b>: masomo yenye tiki ndiyo yatakayotumika. Gusa somo kuliondoa au kulirudisha. Somo lisilopo? Andika jina lake kwenye kisanduku cha Somo jipya kisha gusa Ongeza Somo. Lazima abaki na angalau somo moja.',
  '<b>3. Mfumo wa alama</b>: chagua 100, 50 au 25 (25 ni kwa darasa la 1 na 2 tu). Hii ndiyo alama ya juu kabisa kwa kila somo. Alama inayozidi hapo haikubaliki, na madaraja yanatokana nayo. Chagua kwa makini kabla ya kuingiza alama.',
  '<b>4. Jina la mtihani</b>: chagua kutoka orodha (Muhula wa Kwanza, Nusu Muhula, Jaribio n.k.) au andika jina lako mwenyewe kwenye kisanduku cha Au andika jina lingine (hadi herufi 40). Jina hili ndilo litakalotoka kwenye kichwa cha ripoti na orodha.',
  '<b>5. Mwaka wa masomo</b>: chagua mwaka. Darasa, mtihani na mwaka vilevile haviwezi kuhifadhiwa mara mbili.',
  '<b>6. Mwalimu wa darasa</b>: andika jina la mwalimu. Litaonekana chini ya ripoti. Ukiwa tayari umewahi kuanza matokeo ya darasa hilo, jina hujazwa lenyewe.',
  '<b>7. Saini ya mwalimu</b>: gusa Pakia Saini, chagua picha ya saini kisha hakiki na ukate. Background ya saini inaondolewa yenyewe. Ukiruka sehemu hii, utaonyeshwa onyo wakati wa kuchapisha ripoti na utaweza kuiweka hapo hapo.',
  'Mwisho gusa <b>Tengeneza Jedwali</b>.']],
 ['user-plus','Hatua 3: Weka wanafunzi (sehemu zote)',[
  '<b>Ongeza Mwanafunzi</b>: kitufe cha chini kwenye ukurasa wa Wanafunzi. Jaza <b>Jina</b> (linakuwa herufi kubwa lenyewe), chagua <b>Jinsi</b> (Kiume au Kike), kisha alama za kila somo. Gusa Hifadhi, au Anayefuata ili kuendelea na mwingine.',
  '<b>Bandika majina</b>: bandika majina kutoka WhatsApp au Excel, jina moja kila mstari. Andika M au K mwisho wa jina (mfano ASHA JUMA K). Majina yasiyo na M wala K yatatokea kwenye orodha ya Chagua jinsi, na unagusa M au K kwa kila mmoja kabla ya kuongeza.',
  '<b>Bandika kutoka Excel</b>: unaweza kubandika pia jinsi na alama kwa mpangilio wa masomo yako. Andika - kwa somo ambalo mwanafunzi hakufanya.',
  '<b>Ingiza Haraka</b>: jedwali la kuandika wanafunzi wengi kwa mpigo (jina, jinsi na alama). Mistari tupu inapuuzwa.',
  '<b>Import from SIS</b>: chagua faili la Excel la SIS, majina yanaingia moja kwa moja. Faili lako asili halibadilishwi.',
  '<b>Nakili majina</b>: chukua majina na jinsi kutoka matokeo mengine ya darasa hilo hilo. Alama zinabaki wazi.',
  'Jumla ya wanafunzi, wavulana na wasichana inaonekana juu ya orodha ya Majina.']],
 ['pen-to-square','Hatua 4: Ingiza alama',[
  '<b>Kwa mwanafunzi</b>: gusa jina lake kisha andika alama za masomo yote. Kibodi ya namba ya app ina vitufe +1, −1 na Hakufanya.',
  '<b>Ingiza/Hariri kwa somo</b>: gusa chip ya Ingiza/Hariri kwa somo, chagua somo juu, kisha andika alama za wanafunzi wote kwa somo hilo.',
  'Mwanafunzi ambaye hajajazwa ana kisanduku chenye mpaka wa machungwa. Ukijaza, rangi inatoweka.',
  'Alama inayozidi kikomo inakuwa nyekundu na haihifadhiwi.',
  'Mwanafunzi hakufanya somo? Andika "-" au gusa Hakufanya.',
  'Kila kitu kinahifadhiwa papo hapo. Kishale kinaruka kwenda sehemu inayofuata (unaweza kukizima kwenye Muonekano na Uingizaji).']],
 ['users','Ukurasa wa Wanafunzi',[
  '<b>Tafuta</b>: andika jina kwenye kisanduku cha utafutaji.',
  '<b>Panga kwa nafasi</b>: orodha inapangwa kuanzia nafasi ya kwanza.',
  '<b>Excel</b>: inapakua matokeo kama faili la Excel.',
  '<b>Orodha</b>: inakupeleka kwenye matokeo yote yaliyohifadhiwa.',
  'Chini ya kila alama kuna daraja na nafasi ya somo.',
  'Gusa jina la mwanafunzi kuhariri, kuona ripoti yake au kumfuta. Ukifuta kwa bahati mbaya, gusa TENGUA.',
  'Jina na saini ya mwalimu zikikosekana, utaonyeshwa onyo unapochapisha au kushiriki ripoti, na unaweza kuziweka hapo hapo.']],
 ['folder-open','Matokeo Yangu (Orodha)',[
  'Inaonyesha matokeo yote uliyohifadhi, kila moja na darasa, mtihani na mwaka wake.',
  'Gusa kadi kufungua seti hiyo. Unaweza pia kuifuta kutoka hapa.',
  'Mfumo unakataa kuhifadhi matokeo yanayojirudia (darasa, mtihani na mwaka vilevile).']],
 ['chart-simple','Muhtasari',[
  'Chagua darasa juu ya ukurasa.',
  'Unaona idadi ya wanafunzi, wavulana na wasichana, wastani wa darasa, wastani wa juu na wa chini, na waliofaulu.',
  'Chati ya madaraja A hadi E, wastani wa kila somo na wanafunzi watano bora.',
  'Chini kuna jedwali la tathmini ya matokeo ya darasa.']],
 ['file-lines','Ripoti za wanafunzi',[
  'Chagua darasa na <b>Chagua muonekano wa ripoti</b> (rangi) unayopenda.',
  'Gusa jicho kuona ripoti ya mwanafunzi mmoja. Unaweza kwenda aliyetangulia au anayefuata.',
  'Ripoti ina jina, alama, daraja, nafasi, maoni, saini, muhuri na ufunguo wa madaraja.',
  'Maoni ya mwalimu yanajitokeza kulingana na daraja. Unaweza kuyabadilisha, au kugusa Rudisha maoni ya kawaida.']],
 ['print','Kuchapisha na kupakua',[
  '<b>Chapisha Ripoti Zote</b>: ripoti za wanafunzi wote kwa mpigo.',
  '<b>Hifadhi kama PDF</b>: gusa kadi hiyo, faili moja la PDF lenye ripoti zote linahifadhiwa lenyewe bila kuchapisha.',
  '<b>Chapisha Orodha ya Matokeo</b>: jedwali la darasa zima.',
  '<b>Pakua Excel</b>: faili la .xlsx lenye alama zote.']],
 ['ranking-star','Madaraja na kufaulu',[
  'Daraja linatokana na alama na mfumo uliochagua. Mfano /50: A 41–50, B 31–40, C 21–30, D 11–20, E 0–10.',
  'Kufaulu ni wastani wa 30% au zaidi (darasa la 7 halina sharti hili).',
  'Nafasi inatokana na jumla ya alama. Ukiingiza alama mpya, nafasi na wastani vinahesabiwa upya papo hapo.']],
 ['floppy-disk','Backup na Kurejesha',[
  'Gusa <b>Hifadhi Backup</b>: unapata faili la JSON lenye matokeo yote, mipangilio na nembo.',
  'Lihifadhi mahali salama: WhatsApp, Drive au kompyuta. Fanya hivi mara kwa mara, hasa kabla ya kubadili simu.',
  'Gusa <b>Rejesha Data</b> kuchagua faili la backup na kurudisha kila kitu.']],
 ['palette','Muonekano na Uingizaji',[
  '<b>Muonekano</b>: Otomatiki (inafuata simu), Mwanga au Giza.',
  '<b>Kishale kihamie sehemu inayofuata</b>: ukiwasha, baada ya alama kamili kishale kinaruka chenyewe.',
  '<b>Kibodi ya namba ya app</b>: ukiwasha, fomu ya mwanafunzi inatumia kibodi ya app badala ya ya simu.']]
];
function guideImgs(i){
  var ks=GIMG[String(i)];if(!ks)return '';
  return '<div class="gimgs">'+ks.map(function(k){
    return '<figure class="gfig"><img src="'+GSHOT[k]+'" width="250" height="487" loading="lazy" decoding="async" alt="">'+
      '<ol class="gcap">'+GCAP[k].map(function(c){return '<li>'+c+'</li>';}).join('')+'</ol></figure>';
  }).join('')+'</div>';
}
function guideHTML(){
  return '<p class="gnote">'+ic('lightbulb')+'<span>Fuata hatua kwa mpangilio. Gusa kichwa cha kila sehemu kukifungua.</span></p>'+
    GUIDE.map(function(g,i){
      return '<details class="gd" style="--a:'+CCOL[i%7]+'"><summary><span class="gdn">'+ic(g[0])+'</span><span class="gdt">'+g[1]+'</span>'+ic('chevron-down')+'</summary><ul>'+
        g[2].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'+guideImgs(i)+'</details>';
    }).join('');
}
function dangerHTML(){
  var n=DB.sets.length,st=DB.sets.reduce(function(a,x){return a+x.students.length;},0);
  return '<div class="dz"><span class="dzi">'+ic('triangle-exclamation')+'</span><p>Hii inafuta matokeo yote yaliyohifadhiwa ('+n+' matokeo, wanafunzi '+st+'). Taarifa za shule, nembo, muhuri na saini hazifutwi. Chukua Backup kwanza kama unaweza kuyahitaji baadaye.</p></div>'+
    '<button type="button" class="btn dng" style="width:100%;margin-top:12px;min-height:54px;border-radius:14px"'+(n?'':' disabled')+' data-act="delall">'+ic('trash')+' FUTA MATOKEO YOTE</button>';
}

function togRow(act,on,icon,color,title,desc){

}

function setBody(k){
  var S=DB.settings;

  if(k==='school')return ['schoolName','address','phone','head'].map(function(x){return fld(S,x);}).join('')+
    '<label class="lb">Nembo ya Shule <small>(utahakiki na kurekebisha kabla ya kuhifadhi)</small></label>'+imgRow(S.logo,'image','logopick','logorm','Pakia Nembo')+
    '<label class="lb">Muhuri wa Shule <small>(utahakiki na kurekebisha kabla ya kuhifadhi)</small></label>'+imgRow(S.stamp,'stamp','stamppick','stamprm','Pakia Muhuri')+
    '<label class="lb">Saini ya Mwalimu Mkuu <small>(utahakiki na kurekebisha kabla ya kuhifadhi)</small></label>'+imgRow(S.headSig,'signature','hsigpick','hsigrm','Pakia Saini')+
    '<button type="button" class="btn pri" data-act="schooldone" style="width:100%;margin-top:16px;min-height:52px;border-radius:14px">'+ic('circle-check')+' NIMEJAZA</button>';
  if(k==='look')return '<label class="lb">Muonekano</label>'+themeSel(S.theme||'auto')+
    togRow('anext',S.autoNext!=='0','arrow-right','#2563eb','Kishale kihamie sehemu inayofuata','Baada ya alama kamili, kishale kinaruka chenyewe')+
    togRow('kpset',S.kp!=='0','keyboard','#16a34a','Kibodi ya namba ya app','Kwenye fomu ya mwanafunzi')+
    togRow('vibset',S.vib!=='0','mobile-screen-button','#d97706','Mtetemo wa kibodi','Unatetema ukigusa namba, na kosa la alama');
  if(k==='backup')return vBackup();
  if(k==='danger')return dangerHTML();
  if(k==='guide')return guideHTML();
  if(k==='help')return helpHTML();
  return '';
}

function parseNames(text,defG,set){
  var out=[],seen={},bad=0,dup=0;
  set.students.forEach(function(x){seen[x.name]=1;});
  var isTok=function(c){return /^(M|K|F|-|H|\d+([.,]\d+)?)$/i.test(c);};
  text.split(/\r?\n/).forEach(function(line){
    line=line.replace(/[\u200e\u200f]/g,'').trim();if(!line)return;
    var cols=[line],m,dl=line.indexOf('\t')>=0?'\t':(line.indexOf(';')>=0?';':(line.indexOf(',')>=0?',':''));
    if(dl){
      var c2=line.split(dl).map(function(c){return c.trim();}).filter(function(c,i){return i===0||c!=='';});
      cols=c2.slice(1).every(isTok)?c2:[line.split(dl).join(' ')];
    }
    var name=cols[0].replace(/^\d+\s*[.)\-:]\s*/,'').replace(/^\d+\s+(?=\D)/,''),g=defG,rest=cols.slice(1);
    m=name.match(/^(.*\S)\s+(M|K|F)$/i);
    if(m){name=m[1];g=/^m$/i.test(m[2])?'M':'F';}
    if(rest.length&&/^(M|K|F)$/i.test(rest[0])){g=/^m$/i.test(rest[0])?'M':'F';rest.shift();}
    name=upName(name);if(!name)return;
    var marks={},ok=rest.length<=set.subjects.length,i;
    for(i=0;ok&&i<rest.length;i++){var c=checkMark(rest[i],set.max,set.subjects[i]);if(c.e)ok=false;else marks[set.subjects[i]]=c.n;}
    if(!ok){bad++;return;}
    if(seen[name]){dup++;return;}
    seen[name]=1;out.push({id:uid(),name:name,gender:g,marks:marks,comment:null});
  });
  return {out:out,bad:bad,dup:dup};
}

function homeFit(){
  if(screen!=='home')return;
  var hm=document.getElementById('hm'),main=document.getElementById('main'),nav=document.getElementById('nav');
  if(!hm||!main)return;
  hm.removeAttribute('data-tight');
  main.style.setProperty('--navh',(nav?nav.offsetHeight:74)+'px');
  function steps(){
    var podm=hm.querySelector('.podm');if(!podm)return;
    var g=podm.querySelector('.pdc.g1'),pav=g&&g.querySelector('.pav');if(!pav)return;
    var low=g.querySelector('.pavg')||g.querySelector('.pnm')||pav;
    var top=low.getBoundingClientRect().bottom-pav.getBoundingClientRect().top;
    var cr=parseFloat(getComputedStyle(hm).fontSize)*.9;
    var s1=Math.max(12,Math.round(podm.clientHeight-top-cr-6));
    podm.style.setProperty('--s1',s1+'px');
    podm.style.setProperty('--s2',Math.max(9,Math.round(s1*.72))+'px');
    podm.style.setProperty('--s3',Math.max(6,Math.round(s1*.5))+'px');
  }
  function fits(){
    steps();
    var l=hm.querySelector('.hm-l'),pod=hm.querySelector('.pod');
    if(hm.scrollHeight>hm.clientHeight+1||hm.scrollWidth>hm.clientWidth+1)return false;
    if(l&&(l.scrollHeight>l.clientHeight+1||l.scrollWidth>l.clientWidth+1))return false;
    if(pod&&(pod.scrollHeight>pod.clientHeight+1||pod.scrollWidth>pod.clientWidth+1))return false;
    return true;
  }
  var lo=.4,hi=1.75,best=lo,i,mid;
  for(i=0;i<9;i++){mid=(lo+hi)/2;hm.style.setProperty('--k',mid.toFixed(3));if(fits()){best=mid;lo=mid;}else hi=mid;}
  hm.style.setProperty('--k',best.toFixed(3));
  if(!fits()){hm.setAttribute('data-tight','1');hm.style.setProperty('--k',lo.toFixed(3));fits();}
}

function fitReports(){

  var pr=document.createElement('div');pr.style.cssText='height:266mm;width:1px;position:absolute';root.appendChild(pr);
  var maxH=pr.offsetHeight;root.removeChild(pr);
  var cq=false;try{cq=!!(window.CSS&&CSS.supports&&CSS.supports('width','1cqw'));}catch(e){}
  for(var i=0;i<pages.length;i++){
    var p=pages[i];p.style.zoom='';p.style.width='';p.style.marginLeft='';p.style.marginRight='';
    var h=p.offsetHeight;
    if(maxH>0&&h>maxH){
      var z=Math.max(0.3,maxH/h*0.93);
      if(cq){
        /* Ukubwa wote wa ripoti unategemea upana (cqw), kwa hiyo zoom haisaidii.
           Punguza upana tu: urefu hupungua sawia, na ripoti inatosha ukurasa mmoja. */
        p.style.width=(z*100).toFixed(2)+'%';p.style.marginLeft='auto';p.style.marginRight='auto';

    var wb=new DOMParser().parseFromString(sisBytesText(await sisReadEntry(entries,'xl/workbook.xml')),'application/xml');
    var rel=new DOMParser().parseFromString(sisBytesText(await sisReadEntry(entries,'xl/_rels/workbook.xml.rels')),'application/xml');
    var sheets=wb.getElementsByTagName('sheet'),target='';
    for(var i=0;i<sheets.length;i++){var nm=sheets[i].getAttribute('name')||'';if(nm==='Class Students'||!target){target=sheets[i].getAttribute('r:id')||'';}if(nm==='Class Students'){target=sheets[i].getAttribute('r:id');break;}}
    if(target){var rs=rel.getElementsByTagName('Relationship');for(var j=0;j<rs.length;j++)if(rs[j].getAttribute('Id')===target){var t=rs[j].getAttribute('Target');sheetPath=t.indexOf('/')===0?t.slice(1):'xl/'+t.replace(/^\//,'');break;}}
  }
  var xml=new DOMParser().parseFromString(sisBytesText(await sisReadEntry(entries,sheetPath)),'application/xml'),rows=xml.getElementsByTagName('row'),grid=[];
  for(var r=0;r<rows.length;r++){
    var cells=rows[r].getElementsByTagName('c'),arr=[];
    for(var c=0;c<cells.length;c++){
      var ce=cells[c],ref=ce.getAttribute('r')||'',idx=sisCol(ref),typ=ce.getAttribute('t')||'',val='';
      var is=ce.getElementsByTagName('is')[0],vv=ce.getElementsByTagName('v')[0];
      if(is)val=Array.prototype.map.call(is.getElementsByTagName('t'),function(t){return t.textContent;}).join('');
      else if(vv)val=vv.textContent;
      if(typ==='s'&&val!=='')val=shared[Number(val)]||'';
      else if(typ==='b')val=val==='1'?'TRUE':'FALSE';
      arr[idx]=val;
    }
    grid.push(arr);
  }
  if(!grid.length)throw new Error('Hakuna data kwenye sheet ya SIS.');
  var headers=grid[0].map(function(x){return sisNorm(x);}),out=[];
  for(var i=1;i<grid.length;i++){var row={};headers.forEach(function(h,j){if(h)row[h]=grid[i][j]==null?'':grid[i][j];});out.push(row);}
  return out;
}
function sisParseCsv(text){
  var lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(x){return x.trim()!=='';});
  if(!lines.length)throw new Error('CSV haina data.');
  function parseLine(line){var a=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===','&&!q){a.push(cur);cur='';}else cur+=ch;}a.push(cur);return a;}
  var hs=parseLine(lines[0]).map(sisNorm);return lines.slice(1).map(function(l){var a=parseLine(l),o={};hs.forEach(function(h,i){o[h]=a[i]||'';});return o;});
}
async function importSISFile(file){
  var set=cur();if(!set){toast('Chagua matokeo/darasa kwanza.',true);return;}
  try{
    toast('Inasoma faili la SIS...');
    var rows=/\.csv$/i.test(file.name)?sisParseCsv(await file.text()):await sisParseXlsx(file),valid=rows.map(sisRowToStudent).filter(Boolean),seen={};
    if(!valid.length)throw new Error('Sijaona first_name, middle_name, last_name na sex kwenye faili hili.');
    valid=valid.filter(function(x){var key=x.sisId?'id:'+x.sisId:'name:'+x.name.toLowerCase();if(seen[key])return false;seen[key]=1;return true;});
    var added=[],updated=[],unchanged=0;

      if(x.sisId)st=set.students.filter(function(s){return String(s.sisId||'')===x.sisId;})[0]||null;
      if(!st)st=set.students.filter(function(s){return String(s.name||'').trim().toLowerCase()===x.name.trim().toLowerCase();})[0]||null;

        if(changed)updated.push({st:st,x:x});else unchanged++;

    });

      '<div><span class="gb g-B">↻</span><b>'+updated.length+'</b><small>Waliobadilika</small></div>'+
      '<div><span class="gb g-C">✓</span><b>'+unchanged+'</b><small>Hakuna mabadiliko</small></div></div>'+
      '<div class="card" style="max-height:260px;overflow:auto;padding:8px"><table class="rt"><thead><tr><th>Hali</th><th>Jina</th><th>Jinsia</th><th>Student ID</th></tr></thead><tbody>'+
      valid.slice(0,100).map(function(x){var isNew=added.some(function(a){return (x.sisId&&a.sisId===x.sisId)||(!x.sisId&&a.name===x.name);});return '<tr><td><span class="gb g-'+(isNew?'A':'B')+'">'+(isNew?'MPYA':'UPDATE')+'</span></td><td>'+esc(x.name)+'</td><td>'+esc(x.gender||'-')+'</td><td>'+esc(x.sisId||'-')+'</td></tr>';}).join('')+
      '</tbody></table>'+(valid.length>100?'<small>Inaonyesha 100 kati ya '+valid.length+' wanafunzi.</small>':'')+'</div>'+
      '<p class="hint" style="margin-bottom:0">Alama zilizopo hazitafutwa. Mfumo utatumia Student ID ya SIS kumtambua mwanafunzi.</p></div>'+
      '<div class="mf"><button class="btn ghost" data-act="mclose">GHAIRI</button><button class="btn pri" data-act="sissync">THIBITISHA SYNC</button></div>';
    showModal(html);

}

/* ===== BANDIKA KUTOKA EXCEL: kupanga na kusafisha ===== */
var XG=/^(M|K|F|ME|KE|KIUME|KIKE|MALE|FEMALE)$/i;
function xlsGrid(text){
  return String(text).replace(/[\u200e\u200f\ufeff]/g,'').replace(/[\r\n]+$/,'').split(/\r?\n/).map(function(l){return l.split('\t');})
    .filter(function(r){return r.some(function(c){return c.trim()!=='';});});
}
function xlsHead(r){return r.some(function(c){return /^(jina|name|majina|mwanafunzi|jinsi|sex|gender|s\/?n|no\.?|namba)$/i.test(c.trim());});}
function xlsMark(v){
  v=String(v==null?'':v).trim().replace(/\s+/g,'');
  if(/^(h|x|abs|absent|-+|–|—)$/i.test(v))return '-';
  return v.replace(',','.');
}
function xlsGender(c){return /^m/i.test(c)?'M':'F';}
function xlsRow(cells){
  cells=cells.map(function(c){return String(c).replace(/\s+/g,' ').trim();});
  while(cells.length&&cells[cells.length-1]==='')cells.pop();
  if(cells.length>1&&/^\d+[.)]?$/.test(cells[0])&&cells[1]&&!/^\d+([.,]\d+)?$/.test(cells[1]))cells.shift();
  var name=(cells.shift()||'').replace(/^\d+\s*[.)\-:]\s*/,''),g='',m;
  if(cells.length&&XG.test(cells[0])){g=xlsGender(cells.shift());}
  else if((m=name.match(/^(.*\S)\s+(M|K|F)$/i))){name=m[1];g=xlsGender(m[2]);}
  return {n:upName(name),g:g,m:cells};
}
function xlsApply(text,startIdx,col){
  var set=cur(),tb=$('#qb');if(!set||!tb)return null;
  var grid=xlsGrid(text);if(!grid.length)return null;
  if(col==='n'&&xlsHead(grid[0]))grid.shift();
  var extra=0,n=0;
  grid.forEach(function(cells,i){
    var idx=startIdx+i;
    while(tb.rows.length<=idx)tb.insertAdjacentHTML('beforeend',qrow(set,tb.rows.length+1));
    var tr=tb.rows[idx],mi=$$('.qm',tr),marks=[],from=0;
    if(col==='n'){
      var p=xlsRow(cells);if(!p.n&&!p.m.length)return;
      $('.qn',tr).value=p.n;if(p.g)$('.qg',tr).value=p.g;marks=p.m;
    }else if(col==='g'){
      cells=cells.map(function(c){return String(c).trim();});
      if(cells.length&&XG.test(cells[0])){$('.qg',tr).value=xlsGender(cells.shift());}
      marks=cells;
    }else{marks=cells;from=col;}
    marks.forEach(function(v,k){
      var t=mi[from+k];
      if(t){if(String(v).trim()!=='')t.value=xlsMark(v);}else if(String(v).trim()!=='')extra++;
    });
    n++;
  });
  return {rows:n,extra:extra};
}
function xlsDone(r){
  if(!r){toast('Hakuna data ya kubandika.',true);return;}
  captureQD();persistSession();
  toast(r.rows+' mistari imebandikwa kutoka Excel'+(r.extra?' · alama '+r.extra+' za ziada zimerukwa':''));
}

}

function strength(p){
var s=0;
if(p.length>=6)s++;
if(p.length>=10)s++;
if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;
if(/\d/.test(p)&&/[^A-Za-z0-9]/.test(p))s++;
if(!p)s=0;
var bars=$('meter').children;
for(var i=0;i<4;i++)bars[i].style.background=i<s?cols[s-1]:'';
$('meterTxt').textContent=s?names[s-1]:'';
$('meterTxt').style.color=s?cols[s-1]:'';
}
